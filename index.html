<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base target="_top">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF6; --surface:#FFFFFF; --surface-2:#F7F8FC;
  --ink:#14172B; --ink-2:#5B6376; --ink-3:#8E96AB;
  --line:#E8EBF3; --line-2:#F0F2F8;
  --accent:#5B3DF5; --accent-2:#8267FF; --accent-soft:#EDE9FF;
  --green:#17B26A; --green-soft:#DFF5E8;
  --amber:#F79009; --amber-soft:#FFEEDC;
  --red:#F04438;   --red-soft:#FFE6E4;
  --sky:#2E90FA;   --sky-soft:#DEEDFF;
  --grey:#98A2B3;  --grey-soft:#EDEFF4;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.05);
  --shadow-lift:0 8px 28px rgba(91,61,245,.18);
  --sans:'Plus Jakarta Sans','Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;
  --mono:'JetBrains Mono','Roboto Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:13.5px;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:2px 6px;border-radius:6px}

/* ---------- 外框 ---------- */
.shell{display:flex;min-height:100vh;padding:14px;gap:14px}
.rail{width:88px;flex:0 0 88px;background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:16px 8px;display:flex;flex-direction:column;gap:4px;
  align-items:center;position:sticky;top:14px;height:calc(100vh - 28px)}
.brand{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;margin-bottom:14px;
  box-shadow:var(--shadow-lift);flex:0 0 auto}
.rail button{width:100%;background:none;border:none;border-radius:14px;padding:9px 2px 7px;
  display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--ink-3);
  transition:background .16s,color .16s}
.rail button span{font-size:10.5px;letter-spacing:.02em;font-weight:500}
.rail button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{background:var(--surface-2);color:var(--ink-2)}
.rail button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:2px 6px}
.topbar h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{color:var(--ink-2);font-size:12.5px;margin-top:1px}
.pill{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill span{background:var(--surface);border-radius:999px;padding:7px 14px;font-size:12px;
  color:var(--ink-2);box-shadow:var(--shadow);white-space:nowrap}
.pill span.cfgbtn{cursor:pointer;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill span.cfgbtn:hover{background:var(--accent);color:#fff}
.cfgnote{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;
  font-size:12px;color:var(--ink-2);margin-bottom:16px;line-height:1.6}
.cfgstat{margin-top:10px;font-size:12.5px}
main{padding:0 0 24px}

/* ---------- 卡片 ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
  margin-bottom:14px;overflow:hidden}
.card>h2{margin:0;padding:16px 20px 12px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.card>.body{padding:4px 20px 18px}
.card>h2+.scroll,.card>h2+.body{padding-top:0}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:10px 0 14px}
select,input[type=text],input[type=date],input[type=number],textarea{
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;
  color:var(--ink);transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
button.act{background:var(--accent);color:#fff;border:none;border-radius:11px;padding:9px 18px;
  cursor:pointer;font-weight:600;box-shadow:var(--shadow-lift);transition:transform .12s,filter .15s}
button.act:hover{filter:brightness(1.06);transform:translateY(-1px)}
button.act:active{transform:none}
button.act.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
button.act.ghost:hover{background:var(--line-2)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;vertical-align:top}
th{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);white-space:nowrap;
  text-transform:uppercase;padding-bottom:8px}
tbody tr{border-top:1px solid var(--line-2)}
tbody tr:hover{background:var(--surface-2);cursor:pointer}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto;padding:0 20px 8px}
.scroll table{min-width:1240px}
td.num{white-space:nowrap}
td .tag{white-space:nowrap}

/* ---------- 燈號與標籤 ---------- */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:1px;margin-right:7px}
.green{background:var(--green)} .amber{background:var(--amber)} .red{background:var(--red)}
.grey{background:var(--grey)} .done{background:var(--ink-3)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface-2);
  color:var(--ink-2);font-size:11.5px;font-weight:500;white-space:nowrap}

/* ---------- 指標卡 ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:18px;display:flex;gap:14px;align-items:flex-start}
.ktile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto}
.ktile svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.t-mint{background:var(--green-soft);color:var(--green)}
.t-peach{background:var(--amber-soft);color:var(--amber)}
.t-sky{background:var(--sky-soft);color:var(--sky)}
.t-lilac{background:var(--accent-soft);color:var(--accent)}
.t-rose{background:var(--red-soft);color:var(--red)}
.kbody{min-width:0}
.kpi .label{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .value{font-size:26px;font-weight:800;line-height:1.25;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--ink-3)}

/* ---------- 主視覺卡 ---------- */
.hero{background:linear-gradient(125deg,#5B3DF5 0%,#7B5BFF 55%,#9C7BFF 100%);
  border-radius:var(--r-lg);color:#fff;padding:24px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-lift);margin-bottom:14px}
.hero::after{content:'';position:absolute;right:-60px;top:-70px;width:230px;height:230px;
  border-radius:50%;background:rgba(255,255,255,.10)}
.hero::before{content:'';position:absolute;right:40px;bottom:-90px;width:170px;height:170px;
  border-radius:50%;background:rgba(255,255,255,.07)}
.hero .cap{font-size:12.5px;opacity:.82;font-weight:500}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.035em;margin:4px 0 2px;
  font-variant-numeric:tabular-nums}
.hero .meta{font-size:12.5px;opacity:.85}
.hero .side{position:absolute;right:24px;top:24px;text-align:right;z-index:1}
.hero .side b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.hero .side span{font-size:11.5px;opacity:.82}
.hero .track{height:7px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:16px;
  position:relative;max-width:520px}
.hero .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#fff}
.hero .track u{position:absolute;top:-4px;width:2px;height:15px;background:rgba(255,255,255,.85)}

/* ---------- 進度條 ---------- */
.prog{position:relative;height:7px;border-radius:99px;background:var(--line);min-width:96px;margin-top:7px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#C9BEFF}
.prog b{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.prog span{position:absolute;right:0;top:-19px;font-size:11.5px;font-weight:700;
  font-variant-numeric:tabular-nums}

/* ---------- 甘特圖 ---------- */
.gantt{display:grid;grid-template-columns:290px 1fr;border-top:1px solid var(--line-2)}
.gantt .names{border-right:1px solid var(--line-2)}
.gantt .chart{overflow-x:auto;background:
  repeating-linear-gradient(to right,transparent 0,transparent calc(var(--dw) - 1px),
  var(--line-2) calc(var(--dw) - 1px),var(--line-2) var(--dw))}
.grow{height:34px;border-bottom:1px solid var(--line-2);position:relative;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding:8px 14px;font-size:12.5px}
.grow.lvl1{font-weight:700;background:var(--surface-2)}
.grow.lvl2{padding-left:28px}
.grow.lvl3{padding-left:44px}
.gcell{height:34px;border-bottom:1px solid var(--line-2);position:relative}
.gcell.lvl1{background:rgba(247,248,252,.7)}
.bar-plan{position:absolute;top:9px;height:9px;border-radius:99px;background:#D6CEFF}
.bar-act{position:absolute;top:9px;height:9px;border-radius:99px;background:var(--accent)}
.bar-act.late{background:var(--red)}
.ms{position:absolute;top:11px;width:11px;height:11px;background:#fff;
  border:2.5px solid var(--accent);transform:rotate(45deg);border-radius:2px}
.ms.filled{background:var(--accent)}
.pin{position:absolute;top:4px;width:2px;height:26px;border-radius:2px;background:var(--amber)}
.pin.red{background:var(--red)}
.ckmark{position:absolute;bottom:4px;width:8px;height:8px;border-radius:2px;
  background:var(--ink-3);transform:rotate(45deg)}
.ckmark.ok{background:var(--green)}
.ckmark.bad{background:var(--red)}
.today-line{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--red);z-index:5}
.axis{height:36px;position:relative;border-bottom:1px solid var(--line-2)}
.axis .m{position:absolute;top:0;height:36px;border-left:1px solid var(--line);padding:9px 7px;
  font-size:11px;color:var(--ink-3);font-weight:600}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);padding:12px 20px 16px}
.legend i{display:inline-block;width:16px;height:7px;border-radius:99px;vertical-align:1px;margin-right:5px}

/* ---------- 柏拉圖與熱區 ---------- */
.pareto{width:100%;border-collapse:collapse}
.pareto td{padding:8px 10px;vertical-align:middle;border-top:1px solid var(--line-2)}
.pareto tr:first-child td{border-top:none}
.pareto .bar{position:relative;height:9px;border-radius:99px;background:var(--line)}
.pareto .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#C9BEFF}
.pareto .bar i.hot{background:var(--accent)}
.pareto .cum{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.heat td.c{text-align:center;padding:7px 6px}
.heat .hcell{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;
  font-family:var(--mono);font-size:12px;font-weight:700}
.heat td:first-child{font-family:var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 15px;cursor:pointer;
  background:var(--surface-2);font-size:12.5px;font-weight:500;color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}

/* ---------- 側邊面板 ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);
  transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:40;
  display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(16,24,40,.14)}
.drawer.open{transform:none}
.drawer h3{margin:0;padding:20px 22px 16px;font-size:15px;font-weight:700;display:flex;
  align-items:center;gap:8px;border-bottom:1px solid var(--line-2)}
.drawer h3 button{margin-left:auto;background:var(--surface-2);border:none;color:var(--ink-2);
  cursor:pointer;font-size:17px;line-height:1;width:30px;height:30px;border-radius:9px}
.drawer h3 button:hover{background:var(--line-2)}
.drawer .form{padding:20px 22px;overflow:auto;flex:1}
.drawer label{display:block;margin-bottom:14px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.drawer label input,.drawer label select,.drawer label textarea{display:block;width:100%;
  margin-top:6px;font-size:13.5px;color:var(--ink);font-weight:400}
.drawer .foot{padding:16px 22px;border-top:1px solid var(--line-2);display:flex;gap:9px}
.backdrop{position:fixed;inset:0;background:rgba(20,23,43,.32);z-index:35;display:none;
  backdrop-filter:blur(2px)}
.backdrop.open{display:block}
.readonly{background:var(--surface-2);padding:14px;border-radius:var(--r-md);margin-bottom:18px;font-size:12.5px}

table.checks tbody tr td,table.checks tr td{border-top:1px solid var(--line-2)}
table.checks tr:first-child td{border-top:none}
table.checks{min-width:900px}
.box{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;
  border:1.8px solid var(--rule,#D3D8E3);background:var(--surface);cursor:pointer;
  font-size:12px;font-weight:700;color:#fff;transition:all .15s}
.box:hover{border-color:var(--accent)}
.box.on{background:var(--green);border-color:var(--green)}
.box.off{background:var(--grey);border-color:var(--grey)}
.box.busy{opacity:.4;pointer-events:none}
tr.ck.bad td{background:rgba(240,68,56,.05)}
tr.ck.warn td{background:rgba(247,144,9,.05)}
tr.ck.na td{opacity:.5}
.link{color:var(--accent);cursor:pointer;font-weight:600;font-size:12px}
.link:hover{text-decoration:underline}
/* 分派看板 */
.board{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:14px;align-items:flex-start}
.bcol{flex:0 0 262px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
  display:flex;flex-direction:column;max-height:640px;transition:box-shadow .15s,transform .15s}
.bcol.over{box-shadow:0 0 0 2px var(--accent), var(--shadow-lift);transform:translateY(-2px)}
.bcol[data-owner=""]{background:linear-gradient(var(--surface-2),var(--surface))}
.bcol.mine{box-shadow:0 0 0 2px var(--accent), var(--shadow)}
.bhead{padding:14px 16px 10px;border-bottom:1px solid var(--line-2);display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
.bhead b{font-size:14px}
.bcount{background:var(--accent-soft);color:var(--accent);border-radius:999px;
  padding:1px 9px;font-size:11.5px;font-weight:700}
.badd{margin-left:auto;width:24px;height:24px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--accent);font-size:15px;line-height:1;cursor:pointer;
  font-weight:700;padding:0}
.badd:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.bload{width:100%;font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.bload.over{color:var(--red);font-weight:700}
.bbody{padding:10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px}
.bempty{padding:24px 8px;text-align:center;color:var(--ink-3);font-size:12px}
.bcard{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
  padding:11px 12px;cursor:grab;transition:all .14s}
.bcard:hover{border-color:var(--accent);background:var(--surface);
  box-shadow:0 4px 14px rgba(91,61,245,.10);transform:translateY(-1px)}
.bcard.dragging{opacity:.4;cursor:grabbing}
.bcard.stale{border-left:3px solid var(--red)}
.rep{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px}
.rep.red{background:var(--red-soft);color:var(--red)}
.rep.green{background:var(--green-soft);color:var(--green)}
.btop{display:flex;align-items:center;gap:2px;font-size:11.5px;margin-bottom:5px}
.btitle{font-size:12.5px;font-weight:600;line-height:1.45;margin-bottom:6px}
.bmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--ink-3)}
.bblock{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);
  font-size:11px;color:var(--red)}
.login{display:grid;place-items:center;min-height:82vh;padding:20px}
.loginbox{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:34px 32px;width:min(380px,100%)}
.loginbox h2{margin:0 0 4px;font-size:19px;font-weight:800;text-align:center}
.loginbox p{text-align:center}
.loginbox label{display:block;margin-bottom:14px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.loginbox label input{display:block;width:100%;margin-top:6px;font-size:14px}
.authmail{margin-top:18px;padding:12px;border-radius:var(--r-md);background:var(--accent-soft);
  color:var(--accent);font-family:var(--mono);font-size:12.5px;word-break:break-all;text-align:center;font-weight:600}
.chart{width:100%;overflow-x:auto}
.chart svg{width:100%;height:auto;display:block;min-width:520px}
.ctitle{font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .lbl{fill:var(--ink-2);font-size:11px;font-family:var(--sans)}
.chart .lbl2{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--sans)}
.chart .sub{fill:var(--ink-3);font-size:10px;font-family:var(--mono)}
.chart .axis{fill:var(--ink-3);font-size:10px;font-family:var(--mono)}
.chart .onbar{fill:#fff;font-size:11px;font-weight:700;font-family:var(--mono)}
.chart .barplan{fill:#D6CEFF}
.chart .scurve{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .sarea{fill:var(--accent);opacity:.08}
.chart .todayline{stroke:var(--red);stroke-width:2;stroke-dasharray:4 4}
.chart .dotplan{fill:#fff;stroke:#A99BFF;stroke-width:2.5}
.chart .dotact{fill:var(--accent);stroke:#fff;stroke-width:2}
.subtabs{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:5px;
  box-shadow:var(--shadow);margin-bottom:14px;overflow-x:auto;width:fit-content;max-width:100%}
.subtabs button{border:none;background:none;border-radius:999px;padding:8px 18px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:all .15s}
.subtabs button:hover{background:var(--surface-2);color:var(--ink)}
.subtabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.dropzone{border:2px dashed var(--line);border-radius:var(--r-lg);padding:34px 20px;
  text-align:center;cursor:pointer;transition:all .16s;background:var(--surface-2);margin-top:6px}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dzicon{color:var(--accent);margin-bottom:10px}
.dztitle{font-weight:700;font-size:13.5px;margin-bottom:4px}
.tasklist{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:18px}
.tlhead{padding:9px 12px;background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--ink-2)}
.tlrow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line-2);
  font-size:11.5px;cursor:pointer}
.tlrow:hover{background:var(--surface-2)}
.tlname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

<script>
/* ============================================================
   連線設定
   A) 放在 Apps Script 專案裡當 Index.html → 自動用 google.script.run
   B) 放在 GitHub Pages 等靜態主機 → 用下面的 API_URL 連回 Apps Script
      此時 Apps Script 部署的「存取權」必須設為「任何人」
   ============================================================ */
var BUILD = 'v2026.08.24-a';

/* 預設連線設定。也可以不改這裡，改用畫面右上角的「連線設定」直接填，
   填過的值會存在這台電腦的瀏覽器裡，換電腦要再填一次。 */
var DEFAULT_API_URL   = 'https://script.google.com/macros/s/AKfycbwk0TfBQJivKNCgkBcjnZBte8rkin97mZNxlgBdJSkzUc5G02lwqqHdXtrb1c4fuwP9/exec';

function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ window.localStorage.removeItem(k); }catch(e){} }

function apiUrl(){ return (lsGet('pm.apiUrl') || DEFAULT_API_URL || '').trim(); }
function apiToken(){ return (lsGet('pm.session') || '').trim(); }
function isAdmin(){
  if(!DB || !DB.me) return true;
  var r = String(DB.me.role||'');
  return r === '主管' || r === '管理員';   // 相容舊資料
}
function meName(){ return (DB && DB.me) ? DB.me.name : ''; }

var DB = null, VIEW = 'summary', PROJ = '', EDIT = null;

/* ---------- 呼叫後端 ---------- */
var RPC_ARGS = {
  getDashboard: [], getTemplateHeaders: ['table'],
  updateRecord: ['table','row','patch'], addRecord: ['table','data'], importRows: ['table','rows']
};
var RPC_JSON  = ['getDashboard','getTemplateHeaders'];
var RPC_WRITE = ['updateRecord','addRecord','importRows'];

function inAppsScript(){
  return typeof google !== 'undefined' && google.script && google.script.run;
}

function rpc(name, params, ok, fail){
  params = params || {};
  fail = fail || function(e){ console.error(name, e); };

  // 內嵌與連線模式都走同一個 API 介面，權限才會一致
  if(inAppsScript()){
    var body0 = Object.assign({ api:name, token:apiToken() }, params);
    google.script.run
      .withSuccessHandler(function(res){
        var r; try{ r = JSON.parse(res); }catch(e){ fail(new Error('回傳格式錯誤')); return; }
        if(!r.ok){
          if(r.needLogin){ showLogin(); return; }
          fail(new Error(r.error||'後端回報失敗')); return;
        }
        ok(r.data);
      })
      .withFailureHandler(fail)
      .apiCall(JSON.stringify(body0));
    return;
  }
  var url = apiUrl();
  if(!url || url.indexOf('script.google.com') < 0){
    fail(new Error('尚未設定連線網址。請按右上角的「連線設定」填入 Apps Script 的 /exec 網址。'));
    return;
  }

  var body = Object.assign({ api:name, token:apiToken() }, params), req;
  if(RPC_WRITE.indexOf(name) >= 0){
    req = fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(body), redirect:'follow' });
  } else {
    var qs = Object.keys(body).map(function(k){
      return encodeURIComponent(k)+'='+encodeURIComponent(body[k]); }).join('&');
    req = fetch(url+'?'+qs, { method:'GET', redirect:'follow' });
  }

  req.then(function(r){ return r.text(); })
     .then(function(txt){
       var res;
       try { res = JSON.parse(txt); }
       catch(e){ throw new Error('後端回傳的不是 JSON。多半是部署存取權沒設成「任何人」，'
         + '導致收到 Google 登入頁。開頭內容：'+txt.slice(0,120)); }
       if(!res.ok){
         if(res.needLogin){ showLogin(); return; }
         throw new Error(res.error || '後端回報失敗');
       }
       ok(res.data);
     })
     .catch(function(e){
       if(String(e.message).indexOf('Failed to fetch') >= 0){
         fail(new Error('無法連線到 Apps Script。請確認：1) API_URL 正確且以 /exec 結尾；'
           + '2) 部署的「存取權」設為「任何人」；3) 已用「新版本」重新部署。'));
       } else fail(e);
     });
}

/* ---------- 工具 ---------- */
function roc(ymd){ if(!ymd) return '—'; var p=ymd.split('-'); return (Number(p[0])-1911)+'.'+p[1]+'.'+p[2]; }
function d(ymd){ if(!ymd) return null; var p=ymd.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function days(a,b){ return Math.round((b-a)/86400000); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function lightDot(l){ return '<span class="dot '+l+'"></span>'; }
function pct(n){ return (Math.round(n*10)/10)+'%'; }
function rocWeek(ymd){
  var dt=d(ymd); if(!dt) return '';
  var t=new Date(dt.getTime()); t.setDate(t.getDate()+4-(t.getDay()||7));
  var y0=new Date(t.getFullYear(),0,1);
  var wk=Math.ceil((((t-y0)/86400000)+1)/7);
  return (t.getFullYear()-1911)+'-W'+(wk<10?'0':'')+wk;
}
function progBar(planned, actual){
  return '<div style="min-width:112px;padding-top:2px"><div class="prog"><span>'+pct(actual)+'</span>'+
    '<i style="width:'+Math.min(planned,100)+'%"></i><b style="width:'+Math.min(actual,100)+'%"></b></div></div>';
}
function uniq(list,key){ var seen={},out=[];
  list.forEach(function(x){ var v=x[key]; if(v&&!seen[v]){seen[v]=1;out.push(v);} });
  return out.sort(); }
function tally(list,key){ var m={};
  list.forEach(function(x){ var v=x[key]||'（未填）'; m[v]=(m[v]||0)+1; });
  return Object.keys(m).map(function(k){return {k:k,n:m[k]};}).sort(function(a,b){return b.n-a.n;}); }
function openIssue(t){ return t.open; }

var ICON = {
  folder:'<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h9A1.5 1.5 0 0 1 21 10v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z"/>',
  inbox:'<path d="M4 13h4l1.5 3h5L16 13h4"/><path d="M5.5 5h13l2.5 8v6H3v-6z"/>',
  alert:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5"/><circle cx="12" cy="16" r=".7" fill="currentColor"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3 1.8"/>',
  swap:'<path d="M4 8h13"/><path d="m14 5 3 3-3 3"/><path d="M20 16H7"/><path d="m10 13-3 3 3 3"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  check:'<path d="M9 4h6v2.5H9z"/><path d="M6.5 5.2H5v15.3h14V5.2h-1.5"/><path d="m8.6 12 1.9 1.9 4-4.2"/>'
};
function kpi(label,value,sub,icon,tint){
  return '<div class="kpi">'+
    (icon?'<div class="ktile t-'+(tint||'lilac')+'"><svg viewBox="0 0 24 24">'+ICON[icon]+'</svg></div>':'')+
    '<div class="kbody"><div class="label">'+label+'</div><div class="value">'+value+
    '</div><div class="sub">'+esc(sub)+'</div></div></div>';
}

/* ---------- 登入 ---------- */
function showLogin(msg){
  var rail=document.querySelector('.rail'), top=document.querySelector('.topbar');
  if(rail) rail.style.display='none';
  if(top) top.style.display='none';

  document.getElementById('main').innerHTML =
    '<div class="login"><div class="loginbox">'+
      '<div class="brand" style="margin:0 auto 18px">履</div>'+
      '<h2>專案履約管理</h2>'+
      '<p class="muted" style="margin:0 0 20px">請輸入帳號密碼登入</p>'+
      '<label>帳號<input type="text" id="lgAcc" autocomplete="username"></label>'+
      '<label>密碼<input type="password" id="lgPw" autocomplete="current-password"></label>'+
      '<button class="act" id="lgBtn" style="width:100%;margin-top:6px">登入</button>'+
      '<div id="lgMsg" style="margin-top:12px;font-size:12.5px;min-height:18px;text-align:center">'+
        (msg?'<span style="color:var(--red)">'+esc(msg)+'</span>':'')+'</div>'+
      (inAppsScript()?'':'<div style="margin-top:8px;text-align:center">'+
        '<span class="link" onclick="openConfig()">連線設定</span></div>')+
    '</div></div>';

  var go = function(){
    var a=document.getElementById('lgAcc').value.trim();
    var w=document.getElementById('lgPw').value;
    var st=document.getElementById('lgMsg');
    if(!a||!w){ st.innerHTML='<span style="color:var(--red)">請輸入帳號與密碼。</span>'; return; }
    st.textContent='登入中…';
    var btn=document.getElementById('lgBtn'); btn.disabled=true;
    rpc('login', {account:a, password:w}, function(r){
      lsSet('pm.session', r.token);
      if(rail) rail.style.display='';
      if(top) top.style.display='';
      load();
    }, function(e){
      btn.disabled=false;
      st.innerHTML='<span style="color:var(--red)">'+esc(e.message)+'</span>';
    });
  };
  document.getElementById('lgBtn').onclick=go;
  ['lgAcc','lgPw'].forEach(function(id){
    document.getElementById(id).addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
  });
  document.getElementById('lgAcc').focus();
}

function doLogout(){
  var t=apiToken();
  lsDel('pm.session');
  if(t) rpc('logout', {token:t}, function(){}, function(){});
  DB=null;
  showLogin('已登出。');
}

function openMyPassword(){
  var html='<div class="cfgnote">修改自己的密碼。新密碼至少 6 個字元。</div>'+
    field('目前密碼','oldPassword','','password')+
    field('新密碼','password','','password')+
    field('再輸入一次新密碼','password2','','password');
  openDrawer('修改密碼', html, function(data, ok, fail){
    if(data.password !== data.password2){ alert('兩次輸入的新密碼不一致。'); fail(); return; }
    if(String(data.password||'').length < 6){ alert('新密碼至少 6 個字元。'); fail(); return; }
    rpc('changeMyPassword', {oldPassword:data.oldPassword, password:data.password},
      function(msg){ alert(msg); ok(msg); }, fail);
  });
}

/* ---------- 帳號權限管理（主管） ---------- */
/** 帳號權限：獨立頁面 */
function viewUsersPage(m){
  if(!isAdmin()){ m.innerHTML='<div class="card"><div class="empty">這個功能僅主管可使用。</div></div>'; return; }
  m.innerHTML='<div class="card"><div class="empty">載入中…</div></div>';
  rpc('listUsers', {}, function(users){
    var boss=users.filter(function(u){return u.role==='主管'||u.role==='管理員';}).length;
    var off=users.filter(function(u){return u.status==='停用';}).length;
    var rows=users.map(function(u){
      var isBoss=(u.role==='主管'||u.role==='管理員');
      return '<tr data-acc="'+esc(u.account)+'">'+
        '<td class="num">'+esc(u.account)+'</td>'+
        '<td style="white-space:nowrap"><b>'+esc(u.name)+'</b></td>'+
        '<td><span class="tag" style="'+(isBoss?'background:var(--accent-soft);color:var(--accent)':'')+
          '">'+esc(u.role)+'</span></td>'+
        '<td>'+(u.status==='停用'?'<span style="color:var(--red)">停用</span>'
          :'<span style="color:var(--green)">啟用</span>')+'</td>'+
        '<td class="muted">'+esc(u.note||'')+'</td>'+
        '<td class="muted" style="font-size:11.5px">'+
          (isBoss?'全部功能可編輯':'僅可回報自己負責的工作')+'</td></tr>';
    }).join('');

    m.innerHTML =
     '<div class="kpis">'+
       kpi('帳號總數', users.length, '停用 '+off+' 個', 'layers','lilac')+
       kpi('主管', boss, '可編輯全部功能', 'check','mint')+
       kpi('同仁', users.length-boss-0, '僅可回報工作進度', 'inbox','sky')+
     '</div>'+
     '<div class="card"><h2>帳號權限　<button class="act" style="float:right;margin-top:-4px" '+
       'onclick="openUserEdit()">新增帳號</button></h2>'+
       '<div class="scroll"><table><thead><tr><th>帳號</th><th>顯示名稱</th><th>角色</th>'+
       '<th>狀態</th><th>備註</th><th>權限範圍</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
       '<div class="legend"><span>點任一列可修改角色、停用或重設密碼。'+
       '顯示名稱必須與工項「負責人」、交辦「主辦人」欄完全一致，同仁才看得到自己的工作。</span></div></div>'+
     '<div class="card"><h2>兩種角色的差別</h2><div class="scroll"><table>'+
       '<thead><tr><th>功能</th><th>主管</th><th>同仁</th></tr></thead><tbody>'+
       [['檢視工作分配與專案進度','✓','✓'],
        ['回報自己負責工作的進度','✓','✓'],
        ['新增與分派交辦事項','✓','✗'],
        ['新增專案、工項、調整權重期限','✓','✗'],
        ['Excel 匯入匯出','✓','✗'],
        ['進度圖表','✓','✗'],
        ['帳號權限管理','✓','✗']].map(function(r){
         return '<tr><td>'+r[0]+'</td>'+
           '<td style="color:var(--green);font-weight:700">'+r[1]+'</td>'+
           '<td style="color:'+(r[2]==='✓'?'var(--green)':'var(--ink-3)')+';font-weight:700">'+r[2]+'</td></tr>';
       }).join('')+'</tbody></table></div></div>';

    [].forEach.call(m.querySelectorAll('tr[data-acc]'), function(tr){
      tr.onclick=function(){
        openUserEdit(users.filter(function(x){return x.account===tr.dataset.acc;})[0]);
      };
    });
  }, function(e){ m.innerHTML='<div class="card"><div class="body">讀取失敗：'+esc(e.message)+'</div></div>'; });
}

function openUsers(){
  rpc('listUsers', {}, function(users){
    var rows = users.map(function(u){
      return '<tr data-acc="'+esc(u.account)+'">'+
        '<td class="num">'+esc(u.account)+'</td>'+
        '<td style="white-space:nowrap">'+esc(u.name)+'</td>'+
        '<td><span class="tag">'+esc(u.role)+'</span></td>'+
        '<td>'+(u.status==='停用'?'<span style="color:var(--red)">停用</span>':'啟用')+'</td></tr>';
    }).join('');
    var html='<div class="cfgnote">主管可新增帳號、調整角色、停用與重設密碼。<br><br>'+
      '<b>同仁</b>只能回報自己負責工作的狀態、現況說明與完成百分比，'+
      '不能新增或修改契約內容。</div>'+
      '<div class="scroll" style="padding:0;margin-bottom:16px"><table style="min-width:0">'+
      '<thead><tr><th>帳號</th><th>名稱</th><th>角色</th><th>狀態</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div>'+
      '<button class="act" onclick="openUserEdit()">新增帳號</button>';
    openDrawer('使用者管理', html, null);
    [].forEach.call(document.querySelectorAll('#drawerForm tr[data-acc]'), function(tr){
      tr.onclick=function(){
        openUserEdit(users.filter(function(x){return x.account===tr.dataset.acc;})[0]);
      };
    });
  }, function(e){ alert('讀取失敗：'+e.message); });
}

function openUserEdit(u){
  u = u || null;
  var html='<div class="cfgnote">'+(u?'修改帳號 <b>'+esc(u.account)+'</b>。密碼留空表示不變更。'
    :'新增帳號。')+
    '<br><br><b>顯示名稱必須與工項「負責人」、議題「主辦人」欄的寫法完全一致</b>，'+
    '否則登入後看不到自己的工作。</div>'+
    field('帳號（登入用，不可重複）','account', u?u.account:'')+
    field('顯示名稱（須與負責人欄一致）','name', u?u.name:'')+
    field('角色','role', u?u.role:'同仁','select',['同仁','主管'])+
    field('狀態','status', u?u.status:'啟用','select',['啟用','停用'])+
    field(u?'重設密碼（留空不變更）':'密碼（至少 6 字元）','password','','password')+
    field('備註','note', u?u.note:'')+
    (u?'<button class="act ghost" style="color:var(--red);width:100%" '+
       'onclick="removeUser(\''+esc(u.account)+'\')">移除這個帳號</button>':'');
  openDrawer(u?'編輯帳號':'新增帳號', html, function(data, ok, fail){
    if(!String(data.account||'').trim()){ alert('請填帳號。'); fail(); return; }
    if(!String(data.name||'').trim()){ alert('請填顯示名稱。'); fail(); return; }
    if(!u && String(data.password||'').length < 6){ alert('新帳號的密碼至少 6 個字元。'); fail(); return; }
    if(data.password && String(data.password).length < 6){ alert('密碼至少 6 個字元。'); fail(); return; }
    rpc('saveUser', {user:data}, function(msg){ alert(msg); ok(msg); if(VIEW==='users') render(); }, fail);
  });
}

function removeUser(acc){
  if(!confirm('確定要移除帳號 '+acc+' 嗎？')) return;
  rpc('deleteUser', {account:acc}, function(msg){ alert(msg); closeDrawer(); if(VIEW==='users') render(); },
      function(e){ alert('移除失敗：'+e.message); });
}

/* ---------- 連線設定 ---------- */
function openConfig(){
  var embedded = inAppsScript();
  var html =
    '<div class="cfgnote">'+
      (embedded
        ? '目前是<b>內嵌模式</b>——由 Apps Script 直接輸出，身分以 Google 帳號辨識，不需要填網址。'
        : '目前是<b>連線模式</b>——這個頁面靠下面的網址連回 Apps Script。'+
          '登入身分由帳號密碼決定，與這裡的網址設定無關。')+
    '</div>'+
    field('Apps Script 網址（/exec 結尾）','apiUrl', lsGet('pm.apiUrl')||'')+
    '<div class="cfgnote" style="margin-top:4px">目前實際使用中：<br>'+
      '<code style="word-break:break-all">'+esc(apiUrl()||'（未設定）')+'</code>'+
      (lsGet('pm.apiUrl')?'<br><br>（來自本機設定）':'<br><br>（來自檔案內的預設值）')+'</div>'+
    '<div class="toolbar" style="margin:0">'+
      '<button class="act ghost" id="cfgTest">測試連線</button>'+
      '<button class="act ghost" id="cfgClear">清除本機設定</button>'+
    '</div>'+
    '<div class="cfgstat" id="cfgStat"></div>';

  openDrawer('連線設定', html, function(data, ok, fail){
    var u = String(data.apiUrl||'').trim();
    if(u) lsSet('pm.apiUrl', u); else lsDel('pm.apiUrl');
    ok();
  });

  document.getElementById('cfgTest').onclick = function(){
    var st = document.getElementById('cfgStat');
    var u = document.querySelector('[name=apiUrl]').value.trim() || apiUrl();
    if(!u || u.indexOf('script.google.com')<0){
      st.innerHTML = '<span style="color:var(--red)">網址格式不對，應以 script.google.com 開頭、/exec 結尾。</span>';
      return;
    }
    st.textContent = '測試中…';
    fetch(u+'?api=ping', {redirect:'follow'})
      .then(function(r){ return r.text(); })
      .then(function(txt){
        var res;
        try { res = JSON.parse(txt); }
        catch(e){
          st.innerHTML = '<span style="color:var(--red)">回傳的不是 JSON，'+
            '多半是部署存取權沒設成「任何人」，收到的是 Google 登入頁。</span>';
          return;
        }
        st.innerHTML = res.ok
          ? '<span style="color:var(--green)">連線正常，可以按儲存。</span>'
          : '<span style="color:var(--red)">'+esc(res.error||'後端回報失敗')+'</span>';
      })
      .catch(function(e){
        st.innerHTML = '<span style="color:var(--red)">連不上：'+esc(e.message)+'</span>';
      });
  };

  document.getElementById('cfgClear').onclick = function(){
    lsDel('pm.apiUrl'); lsDel('pm.apiToken'); lsDel('pm.session');
    document.querySelector('[name=apiUrl]').value = '';
    document.getElementById('cfgStat').innerHTML =
      '<span style="color:var(--green)">已清除，將改用檔案內的預設值。</span>';
  };
}

/* ---------- 載入 ---------- */
function fatal(title, lines){
  document.getElementById('main').innerHTML =
    '<div class="card"><h2>'+esc(title)+'</h2><div class="body">'+
    lines.map(function(l){return '<p>'+l+'</p>';}).join('')+'</div></div>';
}

function load(){
  document.getElementById('buildLabel').textContent = BUILD;
  document.getElementById('modeLabel').textContent = inAppsScript() ? '內嵌模式' : '連線模式';
  document.getElementById('menuBtn').style.display = '';
  document.getElementById('main').innerHTML = '<div class="empty">連線中…（'+BUILD+'）</div>';

  if(!apiToken()){ showLogin(); return; }

  if(!inAppsScript() && (!apiUrl() || apiUrl().indexOf('script.google.com')<0)){
    fatal('尚未設定連線網址', [
      '這個頁面不是由 Apps Script 輸出的，需要填入 Apps Script 的部署網址才能讀取資料。',
      '目前網址：<code>'+esc(location.href)+'</code>',
      '<button class="act" onclick="openConfig()">開啟連線設定</button>'
    ]);
    return;
  }

  var done=false;
  var timer=setTimeout(function(){
    if(done) return;
    fatal('伺服器沒有回應（已等待 15 秒）', [
      '1. 分頁還沒建立 —— 回試算表執行選單「專案履約管理 → 初始化分頁」。',
      '2. 授權未完成 —— 在 Apps Script 手動執行一次 <code>setupAllSheets</code>。',
      '3. 分頁被改名 —— 名稱必須是「契約履約」與「議題追蹤」。',
      '4. 放在靜態主機時，Apps Script 部署存取權須為「任何人」，且已用新版本重新部署。',
      '<button class="act" onclick="load()">重新載入</button>'
    ]);
  }, 15000);

  rpc('getDashboard', {}, function(data){
    done=true; clearTimeout(timer);
    DB = data;
    var h=new Date().getHours();
    var hi = h<6?'夜深了':h<11?'早安':h<13?'午安':h<18?'下午好':'晚安';
    document.getElementById('greet').textContent = hi+'，今天有 '+
      DB.projects.filter(function(p){return p.status==='履約中';}).length+' 案在履約';
    document.getElementById('todayLabel').textContent = roc(DB.today);
    document.getElementById('userLabel').textContent =
      (DB.me && DB.me.name ? DB.me.name : '') + (isAdmin() ? '　主管' : '　同仁');
    var nu = document.getElementById('navUsers');
    if(nu) nu.style.display = isAdmin() ? '' : 'none';
    if(!PROJ && DB.projects.length) PROJ = DB.projects[0].code;
    render();
  }, function(e){
    done=true; clearTimeout(timer);
    var msg=(e&&e.message)?e.message:String(e);
    fatal('讀取資料失敗', ['<code>'+esc(msg)+'</code>',
      '請確認兩張分頁已建立，且 Setup.gs 與 Code.gs 內容都已貼入專案。',
      '<button class="act" onclick="load()">重新載入</button>'+
      (inAppsScript()?'':' <button class="act ghost" onclick="openConfig()">連線設定</button>')]);
  });
}

document.getElementById('nav').addEventListener('click', function(e){
  var b = e.target.closest('button[data-v]'); if(!b) return;
  VIEW = b.dataset.v;
  [].forEach.call(this.querySelectorAll('button[data-v]'), function(x){
    x.setAttribute('aria-selected', x===b?'true':'false'); });
  render();
});

/* 三大功能底下的子頁。boss:true 表示只有主管看得到 */
var TABS = {
  work: [
    {k:'board',  t:'分派看板', fn:function(el){ viewBoard(el); }},
    {k:'list',   t:'工作清單', fn:function(el){ viewIssues(el); }},
    {k:'report', t:'回報狀況', fn:function(el){ viewReport(el); }},
    {k:'wimport',t:'匯入匯出', fn:function(el){ viewImport(el); }, boss:true}
  ],
  project: [
    {k:'summary', t:'專案總表', fn:function(el){ viewSummary(el); }},
    {k:'gantt',   t:'甘特圖',   fn:function(el){ viewGantt(el); }},
    {k:'check',   t:'專案檢核', fn:function(el){ viewChecks(el); }},
    {k:'charts',  t:'進度圖表', fn:function(el){ viewCharts(el); }, boss:true},
    {k:'category',t:'分類統計', fn:function(el){ viewCategory(el); }}
  ],
  users: [
    {k:'accounts', t:'帳號管理', fn:function(el){ viewUsersPage(el); }, boss:true}
  ]
};
var SUB = {work:'board', project:'summary', users:'accounts'};

function visibleTabs(v){
  return (TABS[v]||[]).filter(function(t){ return !t.boss || isAdmin(); });
}

function render(){
  var m=document.getElementById('main');
  if(!DB){ m.innerHTML='<div class="empty">連線中…</div>'; return; }

  if(VIEW==='users' && !isAdmin()) VIEW='work';
  var tabs=visibleTabs(VIEW);
  if(!tabs.length){ VIEW='work'; tabs=visibleTabs('work'); }
  if(!tabs.some(function(t){return t.k===SUB[VIEW];})) SUB[VIEW]=tabs[0].k;

  if(!DB.projects.length && VIEW==='project'){
    m.innerHTML='<div class="card"><div class="body">尚未建立任何專案。'+
      (isAdmin()?'請到「專案總表」按新增專案，或用「工作分配 → 匯入匯出」貼上資料。'
                :'請洽主管建立。')+'</div></div>';
    return;
  }

  m.innerHTML = '<div class="subtabs">'+ tabs.map(function(t){
      return '<button data-sub="'+t.k+'" aria-selected="'+(SUB[VIEW]===t.k)+'">'+esc(t.t)+'</button>';
    }).join('') +'</div><div id="sub"></div>';

  [].forEach.call(m.querySelectorAll('[data-sub]'), function(bt){
    bt.onclick=function(){ SUB[VIEW]=bt.dataset.sub; render(); };
  });

  var cur = tabs.filter(function(t){return t.k===SUB[VIEW];})[0];
  cur.fn(document.getElementById('sub'));
}

/** 跨功能跳轉：goTo('project','gantt') */
function goTo(v, sub){
  VIEW=v; if(sub) SUB[v]=sub;
  [].forEach.call(document.querySelectorAll('#nav button[data-v]'), function(x){
    x.setAttribute('aria-selected', x.dataset.v===v?'true':'false'); });
  render();
}

/* ---------- 總表 ---------- */
function viewSummary(m){
  var issues = DB.issues, openAll = issues.filter(openIssue);
  var active = DB.projects.filter(function(p){return p.status==='履約中';}).length;
  var avgA = DB.projects.length ? Math.round(DB.projects.reduce(function(a,p){return a+p.actual;},0)/DB.projects.length*10)/10 : 0;
  var avgP = DB.projects.length ? Math.round(DB.projects.reduce(function(a,p){return a+p.planned;},0)/DB.projects.length*10)/10 : 0;
  var gap = Math.round((avgA-avgP)*10)/10;
  var overdue = DB.projects.reduce(function(a,p){return a+p.overdue;},0);
  var waiting = DB.projects.reduce(function(a,p){return a+p.waiting;},0);
  var nearest = DB.projects.filter(function(p){return p.remain!=='' && p.remain>=0;})
    .sort(function(a,b){return a.remain-b.remain;})[0];

  var rows = DB.projects.map(function(p){
    return '<tr data-proj="'+esc(p.code)+'">'+
      '<td class="num">'+lightDot(p.light)+'<b>'+esc(p.code)+'</b></td>'+
      '<td>'+esc(p.name)+'<div class="muted">'+esc(p.client||'')+'</div></td>'+
      '<td class="num">'+roc(p.finish)+'</td>'+
      '<td class="num r">'+(p.remain===''?'—':p.remain)+'</td>'+
      '<td>'+progBar(p.planned,p.actual)+'<div class="muted" style="font-size:11px;margin-top:4px">預計 '+pct(p.planned)+'</div></td>'+
      '<td class="num r" style="font-weight:700;color:'+(p.diff<0?'var(--red)':'var(--green)')+'">'+(p.diff>0?'+':'')+p.diff+'%</td>'+
      '<td class="num r">'+p.openIssues+'</td>'+
      '<td class="num r">'+(p.overdue?'<b style="color:var(--red)">'+p.overdue+'</b>':'0')+'</td>'+
      '<td class="num r">'+p.problems+'</td>'+
      '<td class="num r">'+p.waiting+'</td>'+
      '<td class="num r">'+checkChip(p)+'</td>'+
      '<td class="num r">'+(p.reportRed?'<b style="color:var(--red)">'+p.reportRed+'</b>':'<span style="color:var(--green)">0</span>')+'</td>'+
      '<td><span class="tag">'+esc(p.status||'')+'</span></td></tr>';
  }).join('');

  m.innerHTML =
   '<div class="hero">'+
     '<div class="cap">全案加權實際進度</div><div class="big">'+pct(avgA)+'</div>'+
     '<div class="meta">預計 '+pct(avgP)+'　'+(gap<0?'落後 '+Math.abs(gap)+' 個百分點':'超前 '+gap+' 個百分點')+'</div>'+
     '<div class="track"><i style="width:'+Math.min(avgA,100)+'%"></i><u style="left:'+Math.min(avgP,100)+'%"></u></div>'+
     (nearest?'<div class="side"><b>'+nearest.remain+' 天</b><span>'+esc(nearest.code)+' 距契約完工</span></div>':'')+
   '</div>'+
   '<div class="kpis">'+
     kpi('在履約案件', active, '共 '+DB.projects.length+' 案', 'folder','lilac')+
     kpi('未結議題', openAll.length, '問題缺失 '+openAll.filter(function(t){return t.type==='問題缺失';}).length+' 件', 'inbox','sky')+
     kpi('逾期議題', overdue, overdue?'需優先處理':'目前無逾期', 'alert', overdue?'rose':'mint')+
     kpi('逾期未回報', DB.projects.reduce(function(a,p){return a+(p.reportRed||0);},0),
         '超過 '+DB.reportDays+' 天沒更新', 'clock',
         DB.projects.reduce(function(a,p){return a+(p.reportRed||0);},0)?'rose':'mint')+
   '</div>'+
   '<div class="card"><h2>專案總表'+(isAdmin()?'　<button class="act ghost" style="float:right;margin-top:-4px" onclick="openNewProject()">新增專案</button>':'')+'</h2><div class="scroll"><table>'+
   '<thead><tr><th>代號</th><th>專案／業主</th><th>契約完工</th><th class="r">剩餘天</th>'+
   '<th>進度（實際／預計）</th><th class="r">差異</th><th class="r">未結</th><th class="r">逾期</th>'+
   '<th class="r">問題</th><th class="r">待回覆</th><th class="r">檢核</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<div class="legend"><span>燈號｜差異 &lt; −10% 或有逾期議題 → 紅；差異 −5%～−10% → 黃；其餘 → 綠</span></div></div>';

  [].forEach.call(m.querySelectorAll('tr[data-proj]'), function(tr){
    tr.onclick = function(){ PROJ = tr.dataset.proj; goTo('project','gantt'); };
  });
}

/* ---------- 甘特圖 ---------- */
function viewGantt(m){
  var p = DB.projects.filter(function(x){return x.code===PROJ;})[0] || DB.projects[0];
  PROJ = p.code;
  var items = DB.workItems[p.code] || [];
  var dated = items.filter(function(i){return i.start && i.end;});

  var head = '<div class="card"><div class="body"><div class="toolbar">'+
    '<select id="projSel">'+DB.projects.map(function(x){
      return '<option value="'+esc(x.code)+'"'+(x.code===p.code?' selected':'')+'>'+esc(x.code)+'　'+esc(x.name)+'</option>';}).join('')+'</select>'+
    '<select id="zoom"><option value="3">縮放：季</option><option value="6">縮放：月</option><option value="14">縮放：週</option></select>'+
    (isAdmin()?'<button class="act" onclick="openNewItem()">新增工項</button>':'')+
    '<span class="muted num">履約起始 '+roc(p.start)+'　契約完工 '+roc(p.finish)+'　工期 '+p.duration+' '+esc(p.mode)+
    (p.extend?'（展延 '+p.extend+'）':'')+'　權重合計 '+p.weightSum+'%</span>'+
    '</div></div></div>';

  if(!dated.length){
    m.innerHTML = head+'<div class="card"><div class="empty">此專案尚無可排程的工項。<br><br>'+
      '<button class="act" onclick="openNewItem()">新增第一個工項</button></div></div>';
    bindProjSel(); return;
  }

  var min = dated.reduce(function(a,i){var s=d(i.start);return(!a||s<a)?s:a;},null);
  var max = dated.reduce(function(a,i){var e=d(i.end);return(!a||e>a)?e:a;},null);
  var fin = d(p.finish); if(fin&&fin>max) max=fin;
  min = new Date(min.getFullYear(),min.getMonth(),1);
  max = new Date(max.getFullYear(),max.getMonth()+1,0);
  var span = days(min,max)+1;
  var dw = Number(lsGet('zoom')||6), width = span*dw;

  var axis='', cur=new Date(min.getFullYear(),min.getMonth(),1);
  while(cur<=max){
    axis += '<div class="m" style="left:'+(days(min,cur)*dw)+'px">'+(cur.getFullYear()-1911)+'.'+
            ('0'+(cur.getMonth()+1)).slice(-2)+'</div>';
    cur = new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  var todayX = days(min,d(DB.today))*dw;

  var pins={};
  DB.issues.filter(function(t){return t.project===p.code && t.link && t.open;})
    .forEach(function(t){ (pins[t.link]=pins[t.link]||[]).push(t); });

  var cks={};
  (DB.checks[p.code]||[]).filter(function(c){return c.link && c.due && !c.na;})
    .forEach(function(c){ (cks[c.link]=cks[c.link]||[]).push(c); });

  var names='', cells='';
  items.forEach(function(i){
    var lvl='lvl'+Math.min(i.level||1,3);
    names += '<div class="grow '+lvl+'" title="'+esc(i.code+' '+i.name)+'">'+
             '<span class="num muted">'+esc(i.code)+'</span>　'+esc(i.name)+'</div>';
    var inner='';
    if(i.start && i.end){
      var x=days(min,d(i.start))*dw, w=Math.max((days(d(i.start),d(i.end))+1)*dw,3);
      if(i.milestone){
        inner += '<div class="ms'+(i.pct>=100?' filled':'')+'" style="left:'+(x-5)+'px" title="里程碑 '+roc(i.end)+'"></div>';
      } else {
        inner += '<div class="bar-plan" style="left:'+x+'px;width:'+w+'px" title="預計 '+roc(i.start)+' – '+roc(i.end)+'"></div>';
        if(i.pct>0){
          var late = i.pct < i.plannedPct-5;
          inner += '<div class="bar-act'+(late?' late':'')+'" style="left:'+x+'px;width:'+Math.max(w*i.pct/100,4)+'px" title="實際 '+i.pct+'%（預計 '+i.plannedPct+'%）"></div>';
        }
      }
    }
    (pins[i.code]||[]).forEach(function(t){
      if(!t.due) return;
      inner += '<div class="pin'+(t.light==='red'?' red':'')+'" style="left:'+(days(min,d(t.due))*dw)+'px" title="'+esc(t.id+'　'+t.title)+'"></div>';
    });
    (cks[i.code]||[]).forEach(function(c){
      var cls = c.finished ? 'ok' : (c.overdue ? 'bad' : '');
      inner += '<div class="ckmark '+cls+'" style="left:'+(days(min,d(c.due))*dw-4)+'px" title="'+
        esc(c.code+'　'+c.name+(c.finished?'（已完成）':'（應完成 '+roc(c.due)+'）'))+'"></div>';
    });
    cells += '<div class="gcell '+lvl+'">'+inner+'</div>';
  });

  m.innerHTML = head+
    '<div class="card"><h2>履約甘特圖</h2>'+
    '<div class="gantt" style="--dw:'+dw+'px">'+
      '<div class="names"><div class="axis"></div>'+names+'</div>'+
      '<div class="chart"><div style="width:'+width+'px;position:relative">'+
        '<div class="axis">'+axis+'</div>'+
        '<div style="position:relative">'+cells+'<div class="today-line" style="left:'+todayX+'px"></div></div>'+
      '</div></div></div>'+
    '<div class="legend">'+
      '<span><i style="background:#D6CEFF"></i>預計工期</span>'+
      '<span><i style="background:var(--accent)"></i>實際完成</span>'+
      '<span><i style="background:var(--red)"></i>落後預計 5% 以上</span>'+
      '<span><i style="background:var(--amber);width:3px;height:13px;border-radius:2px;margin-right:7px"></i>未結議題到期日</span>'+
      '<span><i style="background:var(--green);width:8px;height:8px;border-radius:2px;transform:rotate(45deg);margin-right:8px"></i>檢核已完成</span>'+
      '<span><i style="background:var(--ink-3);width:8px;height:8px;border-radius:2px;transform:rotate(45deg);margin-right:8px"></i>檢核未完成</span>'+
      '<span>◇ 里程碑　┊ 今日</span></div></div>'+
    checkSummaryCard(p)+
    workItemTable(items);

  bindProjSel();
  document.getElementById('zoom').value = String(dw);
  document.getElementById('zoom').onchange = function(){ lsSet('zoom', this.value); render(); };
  [].forEach.call(m.querySelectorAll('tr[data-wrow]'), function(tr){
    tr.onclick = function(){ openWorkItem(Number(tr.dataset.wrow)); };
  });
}
function checkSummaryCard(p){
  var list = (DB.checks[p.code]||[]).filter(function(c){return !c.na;});
  if(!list.length) return '';
  var pending = list.filter(function(c){return !c.finished && (c.overdue || c.dueSoon);})
    .sort(function(a,b){return (a.due||'').localeCompare(b.due||'');});
  var done = list.filter(function(c){return c.finished;}).length;
  var bar = '<div class="prog" style="min-width:200px;max-width:340px"><span>'+
    Math.round(done/list.length*100)+'%</span><b style="width:'+(done/list.length*100)+'%"></b></div>';
  if(!pending.length){
    return '<div class="card"><h2>專案檢核</h2><div class="body">'+bar+
      '<div class="muted" style="margin-top:10px">已完成 '+done+'/'+list.length+' 項，目前沒有逾期或近期到期的項目。</div></div></div>';
  }
  return '<div class="card"><h2>專案檢核　<span class="muted" style="font-weight:400">'+done+'/'+list.length+'</span></h2>'+
    '<div class="body">'+bar+'<div style="margin-top:12px">'+
    pending.map(function(c){
      return '<div style="display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line-2)">'+
        '<span class="num muted" style="width:52px">'+esc(c.code)+'</span>'+
        '<span style="flex:1">'+esc(c.name)+'</span>'+
        '<span class="num" style="color:'+(c.overdue?'var(--red)':'var(--amber)')+';font-weight:600">'+
        roc(c.due)+(c.overdue?'　逾期':'　即將到期')+'</span></div>';
    }).join('')+'</div></div></div>';
}

function bindProjSel(){
  var s=document.getElementById('projSel');
  if(s) s.onchange=function(){ PROJ=this.value; render(); };
}
function taskChip(i){
  var t = i.tasks || {total:0};
  if(!t.total) return '<span class="muted">—</span>';
  var color = t.overdue ? 'var(--red)' : (t.done===t.total ? 'var(--green)' : 'inherit');
  return '<span style="color:'+color+';font-weight:600">'+t.done+'/'+t.total+'</span>'+
    (t.overdue?'<div style="font-size:10.5px;color:var(--red)">逾期 '+t.overdue+'</div>':'');
}

function workItemTable(items){
  var rows = items.map(function(i){
    var lag = i.parent ? '' : (i.pct - i.plannedPct);
    return '<tr data-wrow="'+i.row+'">'+
      '<td class="num">'+esc(i.code)+'</td>'+
      '<td style="padding-left:'+(12+(i.level-1)*14)+'px">'+(i.level===1?'<b>':'')+esc(i.name)+(i.level===1?'</b>':'')+
        (i.milestone?' <span class="tag">里程碑</span>':'')+
        (i.deliverable?'<div class="muted" style="font-size:11px">'+esc(i.deliverable)+'</div>':'')+'</td>'+
      '<td class="num r">'+(i.duration||'—')+'</td>'+

/* ---------- 專案檢核 ---------- */
function checkChip(p){
  if(!p.checkTotal) return '<span class="muted">—</span>';
  var color = p.checkOverdue ? 'var(--red)' : (p.checkDone===p.checkTotal ? 'var(--green)' : 'inherit');
  return '<span style="color:'+color+';font-weight:600">'+p.checkDone+'/'+p.checkTotal+'</span>'+
    (p.checkOverdue?'<div style="font-size:11px;color:var(--red)">逾期 '+p.checkOverdue+'</div>':'');
}

function viewChecks(m){
  var p = DB.projects.filter(function(x){return x.code===PROJ;})[0] || DB.projects[0];
  PROJ = p.code;
  var list = DB.checks[p.code] || [];
  var live = list.filter(function(c){return !c.na;});
  var done = live.filter(function(c){return c.finished;});
  var overdue = live.filter(function(c){return c.overdue;});
  var soon = live.filter(function(c){return c.dueSoon;});
  var rate = live.length ? Math.round(done.length/live.length*100) : 0;

  var head = '<div class="card"><div class="body"><div class="toolbar">'+
    '<select id="projSel">'+DB.projects.map(function(x){
      return '<option value="'+esc(x.code)+'"'+(x.code===p.code?' selected':'')+'>'+esc(x.code)+'　'+esc(x.name)+'</option>';}).join('')+'</select>'+
    (isAdmin()?'<button class="act ghost" onclick="applyChecklist()">套用標準檢核清單</button>':'')+
    '<span class="muted">履約起始 '+roc(p.start)+'　應完成日由「距起始日天數」自動推算</span>'+
    '</div></div></div>';

  if(!list.length){
    m.innerHTML = head+'<div class="card"><div class="empty">此專案尚未建立檢核項目。<br><br>'+
      '按上方「套用標準檢核清單」可一次帶入 '+((DB.checklist||[]).length)+' 個標準項目（專案資料夾、經費預算表、各期報告、請款、結案移交等）。</div></div>';
    bindProjSel(); return;
  }

  var groups = {}, order = [];
  list.forEach(function(c){
    if(!groups[c.group]){ groups[c.group]=[]; order.push(c.group); }
    groups[c.group].push(c);
  });

  var body = order.map(function(g){
    var rows = groups[g].map(function(c){
      var mark = c.na ? 'na' : (c.finished ? 'ok' : (c.overdue ? 'bad' : (c.dueSoon ? 'warn' : '')));
      var state = c.na ? '不適用' : (c.finished ? '已完成'
        : (c.overdue ? '逾期 '+Math.abs(days(d(c.due), d(DB.today)))+' 天'
        : (c.dueSoon ? '剩 '+days(d(DB.today), d(c.due))+' 天' : '')));
      return '<tr data-crow="'+c.row+'" class="ck '+mark+'">'+
        '<td style="width:34px"><span class="box'+(c.finished?' on':'')+(c.na?' off':'')+'" data-toggle="'+c.row+'">'+
          (c.finished?'✓':(c.na?'–':''))+'</span></td>'+
        '<td class="num" style="width:56px">'+esc(c.code)+'</td>'+
        '<td>'+esc(c.name)+(c.must?'':' <span class="tag">選填</span>')+
          (c.deliverable?'<div class="muted" style="font-size:11.5px">應產出：'+esc(c.deliverable)+'</div>':'')+'</td>'+
        '<td style="width:110px">'+(c.link
          ? '<a class="link" data-jump="'+esc(c.link)+'">工項 '+esc(c.link)+'</a>'
          : '<span class="muted">—</span>')+'</td>'+
        '<td class="num" style="width:100px">'+roc(c.due)+'</td>'+
        '<td class="num" style="width:100px">'+roc(c.done)+'</td>'+
        '<td style="width:110px;white-space:nowrap">'+esc(c.owner||'')+'</td>'+
        '<td style="width:100px;white-space:nowrap;font-weight:600;color:'+
          (c.overdue?'var(--red)':(c.dueSoon?'var(--amber)':(c.finished?'var(--green)':'var(--ink-3)')))+
          '">'+state+'</td></tr>';
    }).join('');
    var gd = groups[g].filter(function(c){return !c.na && c.finished;}).length;
    var gt = groups[g].filter(function(c){return !c.na;}).length;
    return '<div class="card"><h2>'+esc(g)+'　<span class="muted" style="font-weight:400">'+gd+'/'+gt+'</span></h2>'+
      '<div class="scroll"><table class="checks">'+rows+'</table></div></div>';
  }).join('');

  m.innerHTML = head+
    '<div class="kpis">'+
      kpi('檢核完成率', rate+'%', done.length+'/'+live.length+' 項', 'check', rate===100?'mint':'lilac')+
      kpi('逾期未完成', overdue.length, overdue.length?'需立即補辦':'目前無逾期', 'alert', overdue.length?'rose':'mint')+
      kpi('14 日內到期', soon.length, '提前準備', 'clock','peach')+
      kpi('不適用', list.filter(function(c){return c.na;}).length, '不計入完成率', 'layers','sky')+
    '</div>'+ body;

  bindProjSel();
  [].forEach.call(m.querySelectorAll('[data-toggle]'), function(el){
    el.onclick = function(e){ e.stopPropagation(); toggleCheck(Number(el.dataset.toggle)); };
  });
  [].forEach.call(m.querySelectorAll('[data-jump]'), function(el){
    el.onclick = function(e){ e.stopPropagation(); goTo('project','gantt'); };
  });
  [].forEach.call(m.querySelectorAll('tr[data-crow]'), function(tr){
    tr.onclick = function(){ openCheckEdit(Number(tr.dataset.crow)); };
  });
}

function toggleCheck(row){
  var list = DB.checks[PROJ]||[];
  var c = list.filter(function(x){return x.row===row;})[0];
  if(!c) return;
  var patch = c.finished
    ? {'狀態':'未開始','實際完成日':''}
    : {'狀態':'已完成','實際完成日':DB.today};
  var el = document.querySelector('[data-toggle="'+row+'"]');
  if(el){ el.classList.add('busy'); }
  rpc('updateRecord', {table:'contract', row:row, patch:patch},
    function(){ load(); },
    function(e){ if(el) el.classList.remove('busy'); alert('更新失敗：'+e.message); });
}

function applyChecklist(){
  if(!confirm('將為「'+PROJ+'」補上標準檢核清單中尚未建立的項目，已存在的不會重複。要繼續嗎？')) return;

      function(e){ alert('套用失敗：'+e.message); });
}

/* ---------- 議題追蹤 ---------- */
var IF = {proj:'', type:'', owner:'', status:'open', major:''};

function issueList(){
  return DB.issues.filter(function(t){
    if(IF.proj && t.project!==IF.proj) return false;
    if(IF.type && t.type!==IF.type) return false;
    if(IF.owner && t.owner!==IF.owner) return false;
    if(IF.major && t.major!==IF.major) return false;
    if(IF.status==='open') return t.open;
    if(IF.status==='overdue') return t.overdue;
    if(IF.status==='closed') return !t.open;
    return true;
  });
}

   '<div class="card"><div class="body"><div class="toolbar">'+

    if(el) el.onchange=function(){ IF[a[1]]=this.value; render(); };
  });

function pareto(list, dim){
  var data = tally(list, dim);
  if(!data.length) return '<div class="empty">沒有符合條件的資料。</div>';
  var total = data.reduce(function(a,b){return a+b.n;},0), max=data[0].n, cum=0;
  var c=0,k=0;
  for(var i=0;i<data.length;i++){ c+=data[i].n; k++; if(c/total>=0.8) break; }
  var rows = data.map(function(x,i){
    cum += x.n;
    var cp = Math.round(cum/total*1000)/10;
    return '<tr><td class="num muted" style="width:26px">'+(i+1)+'</td>'+
      '<td style="width:190px">'+esc(x.k)+'</td>'+
      '<td><div class="bar"><i class="'+(cp<=80.5?'hot':'')+'" style="width:'+(x.n/max*100)+'%"></i></div></td>'+
      '<td class="num r" style="width:46px">'+x.n+'</td>'+
      '<td class="num r" style="width:58px">'+Math.round(x.n/total*1000)/10+'%</td>'+
      '<td class="cum r" style="width:74px">累計 '+cp+'%</td></tr>';
  }).join('');
  return '<table class="pareto"><tbody>'+rows+'</tbody></table>'+
    '<div class="legend"><span>深色為累計 80% 以內的關鍵少數——前 '+k+' 類即佔全部的 '+
    Math.round(c/total*1000)/10+'%，改善資源應集中於此。</span></div>';
}
function cross(list){
  var minors = tally(list,'minor').slice(0,12).map(function(x){return x.k;});
  var projs = uniq(list,'project');
  if(!minors.length||!projs.length) return '<div class="empty">資料不足。</div>';
  var grid={}, maxv=1;
  list.forEach(function(t){
    var key=(t.minor||'（未填）')+'|'+(t.project||'—');
    grid[key]=(grid[key]||0)+1;
  });
  minors.forEach(function(mi){ projs.forEach(function(pj){ maxv=Math.max(maxv,grid[mi+'|'+pj]||0); }); });
  var head='<tr><th>中類 ＼ 專案</th>'+projs.map(function(p){return '<th class="r">'+esc(p)+'</th>';}).join('')+'<th class="r">小計</th></tr>';
  var rows = minors.map(function(mi){
    var sum=0;
    var tds = projs.map(function(pj){
      var v=grid[mi+'|'+pj]||0; sum+=v;
      if(!v) return '<td class="c"></td>';
      var a=0.16+0.74*v/maxv;
      return '<td class="c"><span class="hcell" style="background:rgba(91,61,245,'+a.toFixed(2)+');'+
        (a>0.5?'color:#fff':'color:var(--accent)')+'">'+v+'</span></td>';
    }).join('');
    return '<tr><td>'+esc(mi)+'</td>'+tds+'<td class="c"><b>'+sum+'</b></td></tr>';
  }).join('');
  return '<table class="heat"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table>';
}
function repeats(list){
  var m={};
  list.forEach(function(t){
    var key=(t.project||'—')+'|'+(t.minor||'（未填）');
    if(!m[key]) m[key]={project:t.project, minor:t.minor, n:0, open:0, causes:{}};
    m[key].n++; if(t.open) m[key].open++;
    if(t.cause) m[key].causes[t.cause]=1;
  });
  var rows=Object.keys(m).map(function(k){return m[k];})
    .filter(function(r){return r.n>=2;}).sort(function(a,b){return b.n-a.n;}).slice(0,15);
  if(!rows.length) return '<div class="empty">目前沒有重複發生 2 件以上的中類。</div>';
  return '<table><thead><tr><th>專案</th><th>中類</th><th class="r">件數</th><th class="r">未結</th><th>根本原因</th></tr></thead><tbody>'+

var AF = {week:'', kind:'all', proj:''};
var DRAG = null;

/** 回傳近期週次，含各週的起訖日，供工項以日期區間比對 */
function weekOptions(){
  var out=[], base=d(DB.today);
  for(var i=-1;i<5;i++){
    var dt=new Date(base.getTime()); dt.setDate(dt.getDate()+i*7);
    var mon=new Date(dt.getTime());
    mon.setDate(mon.getDate() - ((mon.getDay()+6)%7));      // 該週週一
    var sun=new Date(mon.getTime()); sun.setDate(sun.getDate()+6);
    out.push({label: rocWeek(mon.getFullYear()+'-'+('0'+(mon.getMonth()+1)).slice(-2)+'-'+('0'+mon.getDate()).slice(-2)),
              mon:mon, sun:sun});
  }
  return out;
}
function weekLabels(){ return weekOptions().map(function(w){return w.label;}); }
function weekRange(label){
  var f = weekOptions().filter(function(w){return w.label===label;})[0];
  return f || null;
}

/** 把議題與工項統一成可分派的卡片 */
function assignCards(){
  var cards=[];
  if(AF.kind!=='item'){
    DB.issues.filter(function(t){return t.open;}).forEach(function(t){
      cards.push({kind:'issue', table:'issue', row:t.row, ownerField:'主辦人',
        id:t.id, title:t.title, project:t.project, owner:t.owner||'',
        due:t.due, week:t.week||'', effort:t.effort||0,
        badge:t.type, priority:t.priority, light:t.light, report:t.report,
        overdue:t.overdue, blocker:t.blocker});
    });
  }
  if(AF.kind!=='issue'){
    Object.keys(DB.workItems).forEach(function(code){
      DB.workItems[code].forEach(function(w){
        if(w.parent || w.status==='已完成') return;
        var late = w.pct < w.plannedPct-5;
        cards.push({kind:'item', table:'contract', row:w.row, ownerField:'負責人',
          id:w.code, title:w.name, project:code, owner:w.owner||'',
          due:w.end, start:w.start, week:'', effort:0,
          badge:'工項', priority:'', light: late?'red':(w.pct>0?'green':'grey'),
          report:w.report, overdue:false, pct:w.pct, plannedPct:w.plannedPct});
      });
    });
  }
  var wr = (AF.week && AF.week!=='none') ? weekRange(AF.week) : null;
  return cards.filter(function(c){
    if(AF.proj && c.project!==AF.proj) return false;
    if(AF.week==='none') return c.kind==='issue' && !c.week;
    if(wr){
      if(c.kind==='issue') return c.week===AF.week;
      // 工項沒有週次欄位，改判斷預計期間是否與該週重疊
      if(!c.start || !c.due) return false;
      return !(d(c.due) < wr.mon || d(c.start) > wr.sun);
    }
    return true;
  });
}

function bindBoard(m){
  var canAssign = isAdmin();
  [].forEach.call(m.querySelectorAll('.bcard'), function(el){
    if(!canAssign){ el.setAttribute('draggable','false'); el.style.cursor='pointer'; }
    el.addEventListener('dragstart', function(e){
      if(!canAssign){ e.preventDefault(); return; }
      DRAG = {row:Number(el.dataset.row), table:el.dataset.table, kind:el.dataset.kind};
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain', el.dataset.row); }catch(err){}
    });
    el.addEventListener('dragend', function(){ el.classList.remove('dragging'); DRAG=null; });
    el.addEventListener('click', function(){ openAssignEdit(el.dataset.table, Number(el.dataset.row), el.dataset.kind); });
  });
  [].forEach.call(m.querySelectorAll('.bcol'), function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('over'); });
    col.addEventListener('drop', function(e){
      e.preventDefault(); col.classList.remove('over');
      if(!canAssign || !DRAG) return;
      var to = col.dataset.owner;
      var patch = {};
      patch[DRAG.table==='issue' ? '主辦人' : '負責人'] = to;
      var d0 = DRAG; DRAG = null;
      rpc('updateRecord', {table:d0.table, row:d0.row, patch:patch},
        function(){ load(); },
        function(err){ alert('改派失敗：'+err.message); });
    });
  });
}

  var rowH=50, padT=26, padL=118, padR=88, w=760, h=padT+ps.length*rowH+16;

  var g='';
  [0,25,50,75,100].forEach(function(v){
    var x=padL+barW*v/100;
    g+='<line x1="'+x+'" y1="'+(padT-10)+'" x2="'+x+'" y2="'+(h-14)+'" class="grid"/>'+
       txt(x,padT-16,v+'%','axis','middle',10);
  });
  ps.forEach(function(p,i){
    var y=padT+i*rowH;
    var pw=barW*Math.min(p.planned,100)/100, aw=barW*Math.min(p.actual,100)/100;
    var col = p.diff<-10?'var(--red)':(p.diff<-5?'var(--amber)':'var(--accent)');

/** 圖二：選定專案的計畫 S 曲線與今日實際位置 */
function chartSCurve(code){
  var items=(DB.workItems[code]||[]).filter(function(w){return !w.parent && w.weight>0 && w.end;});
  var p=DB.projects.filter(function(x){return x.code===code;})[0];
  if(!items.length||!p) return '';
  var sorted=items.slice().sort(function(a,b){return (a.end||'').localeCompare(b.end||'');});
  var total=sorted.reduce(function(a,w){return a+w.weight;},0)||1;
  var minD=d(p.start)||d(sorted[0].end), maxD=d(sorted[sorted.length-1].end);
  var fin=d(p.finish); if(fin&&fin>maxD) maxD=fin;
  var span=Math.max(days(minD,maxD),1);

  var w=760,h=300,padL=48,padR=22,padT=22,padB=40;
  var iw=w-padL-padR, ih=h-padT-padB;
  var X=function(dt){ return padL+iw*Math.min(Math.max(days(minD,dt),0),span)/span; };
  var Y=function(v){ return padT+ih-ih*Math.min(v,100)/100; };

  var g='';
  [0,25,50,75,100].forEach(function(v){
    g+='<line x1="'+padL+'" y1="'+Y(v)+'" x2="'+(w-padR)+'" y2="'+Y(v)+'" class="grid"/>'+
       txt(padL-8,Y(v)+4,v+'%','axis','end',10);
  });
  var cur=new Date(minD.getFullYear(),minD.getMonth(),1), guard=0;
  while(cur<=maxD && guard++<80){
    if(cur>=minD) g+=txt(X(cur),h-14,(cur.getFullYear()-1911)+'.'+('0'+(cur.getMonth()+1)).slice(-2),'axis','middle',9);
    cur=new Date(cur.getFullYear(),cur.getMonth()+2,1);
  }

  var cum=0, pts=[[X(minD),Y(0)]];
  sorted.forEach(function(it){ cum+=it.weight; pts.push([X(d(it.end)),Y(cum/total*100)]); });
  g+='<polyline points="'+pts.map(function(a){return a[0]+','+a[1];}).join(' ')+'" class="scurve"/>';
  var area='M'+padL+','+Y(0)+' '+pts.map(function(a){return 'L'+a[0]+','+a[1];}).join(' ')+
           ' L'+pts[pts.length-1][0]+','+Y(0)+' Z';
  g+='<path d="'+area+'" class="sarea"/>';

  var tx=X(d(DB.today));
  g+='<line x1="'+tx+'" y1="'+padT+'" x2="'+tx+'" y2="'+(padT+ih)+'" class="todayline"/>'+
     txt(tx,padT-6,'今日','axis','middle',10);
  g+='<circle cx="'+tx+'" cy="'+Y(p.planned)+'" r="5" class="dotplan"/>'+
     '<circle cx="'+tx+'" cy="'+Y(p.actual)+'" r="5" class="dotact"/>'+
     txt(tx+10,Y(p.planned)+4,'預計 '+pct(p.planned),'sub',null,10)+
     txt(tx+10,Y(p.actual)+4,'實際 '+pct(p.actual),'lbl2',null,11);
  return svgWrap(w,h,g,'計畫累積曲線與今日落點');
}

/** 圖三：同仁進度（負責工項加權完成率） */
function chartStaffProgress(){
  var people=DB.people.map(function(x){return x.name;});
  var rows=people.map(function(name){
    var mine=[];
    Object.keys(DB.workItems).forEach(function(k){
      DB.workItems[k].forEach(function(w){
        if(w.owner===name && !w.parent && w.weight>0) mine.push(w);
      });
    });
    var tw=mine.reduce(function(a,w){return a+w.weight;},0);
    var act=tw?mine.reduce(function(a,w){return a+w.weight*w.pct/100;},0)/tw*100:0;
    var pln=tw?mine.reduce(function(a,w){return a+w.weight*w.plannedPct/100;},0)/tw*100:0;
    return {name:name, items:mine.length, actual:Math.round(act*10)/10, planned:Math.round(pln*10)/10};
  }).filter(function(r){return r.items>0;});
  if(!rows.length) return '';

  var rowH=50,padT=26,padL=92,padR=96,w=760,h=padT+rows.length*rowH+16, barW=w-padL-padR;
  var g='';
  [0,25,50,75,100].forEach(function(v){
    var x=padL+barW*v/100;
    g+='<line x1="'+x+'" y1="'+(padT-10)+'" x2="'+x+'" y2="'+(h-14)+'" class="grid"/>'+
       txt(x,padT-16,v+'%','axis','middle',10);
  });
  rows.forEach(function(r,i){
    var y=padT+i*rowH, diff=Math.round((r.actual-r.planned)*10)/10;
    var col=diff<-10?'var(--red)':(diff<-5?'var(--amber)':'var(--green)');
    g+= txt(6,y+16,r.name,'lbl2')+
        txt(6,y+30,r.items+' 項工項','sub',null,10)+
        '<rect x="'+padL+'" y="'+(y+4)+'" width="'+(barW*Math.min(r.planned,100)/100)+'" height="9" rx="4.5" class="barplan"/>'+
        '<rect x="'+padL+'" y="'+(y+16)+'" width="'+(barW*Math.min(r.actual,100)/100)+'" height="9" rx="4.5" fill="'+col+'"/>'+
        txt(w-padR+8,y+12,'預計 '+pct(r.planned),'sub',null,10)+
        txt(w-padR+8,y+25,'實際 '+pct(r.actual),'lbl2',null,11)+
        '<text x="'+(w-padR+8)+'" y="'+(y+38)+'" font-size="10" font-weight="700" '+
        'font-family="var(--mono)" fill="'+(diff<0?'var(--red)':'var(--green)')+'">'+
        (diff>0?'+':'')+diff+'%</text>';
  });
  return svgWrap(w,h,g,'同仁進度：所負責工項的加權完成率');
}

/** 圖四：同仁交辦事項狀態堆疊 */
function chartStaffTasks(){
  var people=DB.people.map(function(x){return x.name;});
  var rows=people.map(function(name){
    var mine=DB.issues.filter(function(t){return t.owner===name;});
    return {
      name:name,
      done:mine.filter(function(t){return !t.open;}).length,
      doing:mine.filter(function(t){return t.open && !t.overdue;}).length,
      late:mine.filter(function(t){return t.overdue;}).length,
      linked:mine.filter(function(t){return t.link;}).length,
      adhoc:mine.filter(function(t){return !t.link;}).length
    };
  }).filter(function(r){return r.done+r.doing+r.late>0;});
  if(!rows.length) return '';
  var max=Math.max.apply(null,rows.map(function(r){return r.done+r.doing+r.late;}).concat([1]));

  var rowH=42,padT=24,padL=92,padR=120,w=760,h=padT+rows.length*rowH+16, barW=w-padL-padR;
  var g='';
  rows.forEach(function(r,i){
    var y=padT+i*rowH, x=padL;
    var seg=[[r.done,'var(--green)','已結'],[r.doing,'var(--accent)','進行'],[r.late,'var(--red)','逾期']];
    seg.forEach(function(sg){
      if(!sg[0]) return;
      var wd=barW*sg[0]/max;
      g+='<rect x="'+x+'" y="'+(y+6)+'" width="'+wd+'" height="18" fill="'+sg[1]+'"/>'+
         (wd>22?txt(x+wd/2,y+19,String(sg[0]),'onbar','middle',11):'');
      x+=wd;
    });
    g+= txt(6,y+16,r.name,'lbl2')+
        txt(6,y+30,'連結 '+r.linked+'／臨時 '+r.adhoc,'sub',null,10)+
        txt(x+10,y+20,'共 '+(r.done+r.doing+r.late)+' 件','sub',null,10);
  });
  g+='<g>'+
    '<rect x="'+padL+'" y="6" width="9" height="9" fill="var(--green)"/>'+txt(padL+13,14,'已結案','axis',null,10)+
    '<rect x="'+(padL+70)+'" y="6" width="9" height="9" fill="var(--accent)"/>'+txt(padL+83,14,'進行中','axis',null,10)+
    '<rect x="'+(padL+140)+'" y="6" width="9" height="9" fill="var(--red)"/>'+txt(padL+153,14,'逾期','axis',null,10)+
    '</g>';
  return svgWrap(w,h,g,'同仁交辦事項狀態');
}

function readWorkbook(file){
  var pv=document.getElementById('impPreview');
  if(typeof XLSX === 'undefined'){
    pv.innerHTML='<span style="color:var(--red)">Excel 元件尚未載入，請檢查網路後重新整理。</span>';
    return;
  }
  pv.innerHTML='<span class="muted">讀取中…</span>';
  var fr=new FileReader();
  fr.onload=function(e){
    var wb;
    try { wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true}); }
    catch(err){ pv.innerHTML='<span style="color:var(--red)">檔案讀取失敗：'+esc(err.message)+'</span>'; return; }

    var found=[];
    wb.SheetNames.forEach(function(nm){
      var table = SHEET_MAP[nm.trim()];
      if(!table) return;
      var aoa = XLSX.utils.sheet_to_json(wb.Sheets[nm], {header:1, raw:false, dateNF:'yyyy-mm-dd'});
      // 找出標題列：第一列含有已知關鍵欄名者
      var hi=-1;
      for(var i=0;i<Math.min(aoa.length,6);i++){
        var row=(aoa[i]||[]).map(function(x){return String(x||'').trim();});
        if(row.indexOf('議題編號')>=0 || row.indexOf('記錄類型')>=0){ hi=i; break; }
      }
      if(hi<0) return;
      var head=aoa[hi].map(function(x){return String(x||'').trim();});
      var rows=[];
      for(var r=hi+1;r<aoa.length;r++){
        var line=aoa[r]||[];
        // 跳過「必填／勿填」標示列與空列
        var joined=line.map(function(x){return String(x||'').trim();}).join('');
        if(!joined) continue;
        if(/^(必填|勿填)+$/.test(joined)) continue;
        var o={}, any=false;
        head.forEach(function(h,ci){
          if(!h) return;
          var v=line[ci];
          v = (v===undefined||v===null) ? '' : String(v).trim();
          o[h]=v; if(v) any=true;
        });
        if(any) rows.push(o);
      }
      if(rows.length) found.push({sheet:nm, table:table, rows:rows});
    });

    if(!found.length){
      pv.innerHTML='<div class="cfgnote" style="color:var(--red)">'+
        '這個檔案裡找不到可匯入的分頁。分頁名稱必須是「契約履約」「議題追蹤」或「工作分派」，'+
        '且要有標題列。目前檔案的分頁：'+esc(wb.SheetNames.join('、'))+'</div>';
      return;
    }

    PENDING = found;
    pv.innerHTML =
      '<div class="cfgnote">已讀取 <b>'+esc(file.name)+'</b>，內容如下。確認無誤後按匯入。</div>'+
      '<table style="margin-bottom:14px"><thead><tr><th>分頁</th><th class="r">資料筆數</th>'+
      '<th>前兩筆</th></tr></thead><tbody>'+
      found.map(function(f){
        var k = f.table==='contract' ? '名稱' : '標題';
        return '<tr><td><b>'+esc(f.sheet)+'</b></td><td class="num r">'+f.rows.length+'</td>'+
          '<td class="muted">'+esc(f.rows.slice(0,2).map(function(r){
            return r[k]||r['議題編號']||r['專案代號']||'—';}).join('　／　'))+'</td></tr>';
      }).join('')+'</tbody></table>'+
      '<button class="act" onclick="doFileImport()">匯入</button>'+
      '<div id="fileMsg" style="margin-top:12px"></div>';
  };
  fr.readAsArrayBuffer(file);
}

function doFileImport(){
  if(!PENDING || !PENDING.length) return;
  var msg=document.getElementById('fileMsg');
  var queue=PENDING.slice(), results=[];
  msg.textContent='匯入中…';

  (function next(){
    if(!queue.length){
      msg.innerHTML='<span style="color:var(--green)">'+esc(results.join('；'))+'</span>';
      PENDING=null;
      load();
      return;
    }
    var f=queue.shift();
    rpc('importRows', {table:f.table, rows:f.rows}, function(r){
      results.push(f.sheet+'：'+r);
      next();
    }, function(e){
      msg.innerHTML='<span style="color:var(--red)">'+esc(f.sheet)+' 匯入失敗：'+esc(e.message)+'</span>';
    });
  })();
}

function field(label,name,value,type,options){
  var input;
  if(type==='select'){
    input='<select name="'+name+'">'+options.map(function(o){
      return '<option'+(o===value?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
  } else if(type==='textarea'){
    input='<textarea name="'+name+'" rows="3">'+esc(value||'')+'</textarea>';
  } else {
    input='<input type="'+(type||'text')+'" name="'+name+'" value="'+esc(value||'')+'">';
  }
  return '<label>'+label+input+'</label>';
}

/** 由工項編號的小數點數量推算階層：1 → 1、1.1 → 2、1.1.1 → 3 */
function levelOf(code){ return String(code||'').split('.').length; }

function openNewItem(){
  var items = DB.workItems[PROJ] || [];
  var people = DB.people.map(function(p){return p.name;});
  var used = items.map(function(w){return w.code;});

  // 猜一個還沒用過的編號：延續最後一個同層編號
  var next = '1';
  if(used.length){
    var last = used[used.length-1];
    var parts = String(last).split('.');
    parts[parts.length-1] = String(Number(parts[parts.length-1] || 0) + 1);
    next = parts.join('.');
    while(used.indexOf(next) >= 0){
      parts[parts.length-1] = String(Number(parts[parts.length-1]) + 1);
      next = parts.join('.');
    }
  }
  var weightLeft = Math.max(0, Math.round((100 - items.filter(function(w){return !w.parent;})
    .reduce(function(a,w){return a+(w.weight||0);},0))*10)/10);

  var html =
    '<div class="cfgnote">新增到專案 <b>'+esc(PROJ)+'</b>。'+
    '編號用小數點表示階層（<code>2</code> 是大項、<code>2.1</code> 是其下的工項），'+
    '系統會自動判斷縮排與上下層關係。<b>日期不用填</b>——填工期天數與前置工項，系統會自動排程。'+
    (weightLeft>0?'<br><br>這個專案的權重還剩 <b>'+weightLeft+'%</b> 可分配。'
                 :'<br><br>這個專案的權重已滿 100%，若要新增請先調整其他工項。')+'</div>'+
    field('工項編號（必填）','工項編號',next)+
    field('工項名稱（必填）','名稱','')+
    field('工期天數（大項留空，由子項自動彙整）','工期天數','','number')+
    field('前置工項（留空＝從履約起始日起算）','前置工項','','select',[''].concat(used))+
    field('權重 %（同專案末端工項合計 100；大項填 0）','權重(%)','','number')+
    field('負責人','負責人',people[0]||'','select',[''].concat(people))+

  openDrawer('新增工項', html, function(data, ok, fail){
    var code = String(data['工項編號']||'').trim();
    if(!code){ alert('請填工項編號。'); fail(); return; }

      field('負責人','負責人',i.owner,'select',DB.people.map(function(p){return p.name;}))+
      field('交付成果','交付成果',i.deliverable)+
      field('備註','備註','','textarea');

  openDrawer((mineOnly?'回報進度　':'更新工項　')+i.code, html, function(data, ok, fail){
    rpc('updateRecord', {table:'contract', row:row, patch:data}, ok, fail);
  });
  [].forEach.call(document.querySelectorAll('#drawerForm .tlrow'), function(el){
    el.onclick = function(){ openIssueEdit(Number(el.dataset.task)); };
  });
}

load();
</script>
</body>
</html>
