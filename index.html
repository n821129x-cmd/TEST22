<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF6; --surface:#FFFFFF; --surface-2:#F7F8FC;
  --ink:#14172B; --ink-2:#5B6376; --ink-3:#8E96AB;
  --line:#E8EBF3; --line-2:#F0F2F8;
  --accent:#5B3DF5; --accent-2:#8267FF; --accent-soft:#EDE9FF;
  --green:#17B26A; --green-soft:#DFF5E8;
  --amber:#F79009; --amber-soft:#FFEEDC;
  --red:#F04438;   --red-soft:#FFE6E4;
  --sky:#2E90FA;   --sky-soft:#DEEDFF;
  --grey:#98A2B3;  --grey-soft:#EDEFF4;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.05);
  --shadow-lift:0 8px 28px rgba(91,61,245,.18);
  --sans:'Plus Jakarta Sans','Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;
  --mono:'JetBrains Mono','Roboto Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:13.5px;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:2px 6px;border-radius:6px}

/* ---------- 外框 ---------- */
.shell{display:flex;min-height:100vh;padding:14px;gap:14px}
.rail{width:88px;flex:0 0 88px;background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:16px 8px;display:flex;flex-direction:column;gap:4px;
  align-items:center;position:sticky;top:14px;height:calc(100vh - 28px)}
.brand{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;margin-bottom:14px;
  box-shadow:var(--shadow-lift);flex:0 0 auto}
.rail button{width:100%;background:none;border:none;border-radius:14px;padding:9px 2px 7px;
  display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--ink-3);
  transition:background .16s,color .16s}
.rail button span{font-size:10.5px;letter-spacing:.02em;font-weight:500}
.rail button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{background:var(--surface-2);color:var(--ink-2)}
.rail button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:2px 6px}
.topbar h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{color:var(--ink-2);font-size:12.5px;margin-top:1px}
.pill{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill span{background:var(--surface);border-radius:999px;padding:7px 14px;font-size:12px;
  color:var(--ink-2);box-shadow:var(--shadow);white-space:nowrap}
main{padding:0 0 24px}

/* ---------- 卡片 ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
  margin-bottom:14px;overflow:hidden}
.card>h2{margin:0;padding:16px 20px 12px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.card>.body{padding:4px 20px 18px}
.card>h2+.scroll,.card>h2+.body{padding-top:0}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:10px 0 14px}
select,input[type=text],input[type=date],input[type=number],textarea{
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;
  color:var(--ink);transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
button.act{background:var(--accent);color:#fff;border:none;border-radius:11px;padding:9px 18px;
  cursor:pointer;font-weight:600;box-shadow:var(--shadow-lift);transition:transform .12s,filter .15s}
button.act:hover{filter:brightness(1.06);transform:translateY(-1px)}
button.act:active{transform:none}
button.act.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
button.act.ghost:hover{background:var(--line-2)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;vertical-align:top}
th{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);white-space:nowrap;
  text-transform:uppercase;padding-bottom:8px}
tbody tr{border-top:1px solid var(--line-2)}
tbody tr:hover{background:var(--surface-2);cursor:pointer}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto;padding:0 20px 8px}
.scroll table{min-width:1080px}
td.num{white-space:nowrap}
td .tag{white-space:nowrap}

/* ---------- 燈號與標籤 ---------- */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:1px;margin-right:7px}
.green{background:var(--green)} .amber{background:var(--amber)} .red{background:var(--red)}
.grey{background:var(--grey)} .done{background:var(--ink-3)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface-2);
  color:var(--ink-2);font-size:11.5px;font-weight:500;white-space:nowrap}

/* ---------- 指標卡 ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:18px;display:flex;gap:14px;align-items:flex-start}
.ktile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto}
.ktile svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.t-mint{background:var(--green-soft);color:var(--green)}
.t-peach{background:var(--amber-soft);color:var(--amber)}
.t-sky{background:var(--sky-soft);color:var(--sky)}
.t-lilac{background:var(--accent-soft);color:var(--accent)}
.t-rose{background:var(--red-soft);color:var(--red)}
.kbody{min-width:0}
.kpi .label{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .value{font-size:26px;font-weight:800;line-height:1.25;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--ink-3)}

/* ---------- 主視覺卡 ---------- */
.hero{background:linear-gradient(125deg,#5B3DF5 0%,#7B5BFF 55%,#9C7BFF 100%);
  border-radius:var(--r-lg);color:#fff;padding:24px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-lift);margin-bottom:14px}
.hero::after{content:'';position:absolute;right:-60px;top:-70px;width:230px;height:230px;
  border-radius:50%;background:rgba(255,255,255,.10)}
.hero::before{content:'';position:absolute;right:40px;bottom:-90px;width:170px;height:170px;
  border-radius:50%;background:rgba(255,255,255,.07)}
.hero .cap{font-size:12.5px;opacity:.82;font-weight:500}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.035em;margin:4px 0 2px;
  font-variant-numeric:tabular-nums}
.hero .meta{font-size:12.5px;opacity:.85}
.hero .side{position:absolute;right:24px;top:24px;text-align:right;z-index:1}
.hero .side b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.hero .side span{font-size:11.5px;opacity:.82}
.hero .track{height:7px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:16px;
  position:relative;max-width:520px}
.hero .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#fff}
.hero .track u{position:absolute;top:-4px;width:2px;height:15px;background:rgba(255,255,255,.85)}

/* ---------- 進度條 ---------- */
.prog{position:relative;height:7px;border-radius:99px;background:var(--line);min-width:96px;margin-top:7px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#C9BEFF}
.prog b{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.prog span{position:absolute;right:0;top:-19px;font-size:11.5px;font-weight:700;
  font-variant-numeric:tabular-nums}

/* ---------- 甘特圖 ---------- */
.gantt{display:grid;grid-template-columns:290px 1fr;border-top:1px solid var(--line-2)}
.gantt .names{border-right:1px solid var(--line-2)}
.gantt .chart{overflow-x:auto;background:
  repeating-linear-gradient(to right,transparent 0,transparent calc(var(--dw) - 1px),
  var(--line-2) calc(var(--dw) - 1px),var(--line-2) var(--dw))}
.grow{height:34px;border-bottom:1px solid var(--line-2);position:relative;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding:8px 14px;font-size:12.5px}
.grow.lvl1{font-weight:700;background:var(--surface-2)}
.grow.lvl2{padding-left:28px}
.grow.lvl3{padding-left:44px}
.gcell{height:34px;border-bottom:1px solid var(--line-2);position:relative}
.gcell.lvl1{background:rgba(247,248,252,.7)}
.bar-plan{position:absolute;top:9px;height:9px;border-radius:99px;background:#D6CEFF}
.bar-act{position:absolute;top:9px;height:9px;border-radius:99px;background:var(--accent)}
.bar-act.late{background:var(--red)}
.ms{position:absolute;top:11px;width:11px;height:11px;background:#fff;
  border:2.5px solid var(--accent);transform:rotate(45deg);border-radius:2px}
.ms.filled{background:var(--accent)}
.pin{position:absolute;top:4px;width:2px;height:26px;border-radius:2px;background:var(--amber)}
.pin.red{background:var(--red)}
.today-line{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--red);z-index:5}
.axis{height:36px;position:relative;border-bottom:1px solid var(--line-2)}
.axis .m{position:absolute;top:0;height:36px;border-left:1px solid var(--line);padding:9px 7px;
  font-size:11px;color:var(--ink-3);font-weight:600}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);padding:12px 20px 16px}
.legend i{display:inline-block;width:16px;height:7px;border-radius:99px;vertical-align:1px;margin-right:5px}

/* ---------- 柏拉圖與熱區 ---------- */
.pareto{width:100%;border-collapse:collapse}
.pareto td{padding:8px 10px;vertical-align:middle;border-top:1px solid var(--line-2)}
.pareto tr:first-child td{border-top:none}
.pareto .bar{position:relative;height:9px;border-radius:99px;background:var(--line)}
.pareto .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#C9BEFF}
.pareto .bar i.hot{background:var(--accent)}
.pareto .cum{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.heat td.c{text-align:center;padding:7px 6px}
.heat .hcell{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;
  font-family:var(--mono);font-size:12px;font-weight:700}
.heat td:first-child{font-family:var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 15px;cursor:pointer;
  background:var(--surface-2);font-size:12.5px;font-weight:500;color:var(--ink-2);transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}

/* ---------- 側邊面板 ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);
  transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:40;
  display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(16,24,40,.14)}
.drawer.open{transform:none}
.drawer h3{margin:0;padding:20px 22px 16px;font-size:15px;font-weight:700;display:flex;
  align-items:center;gap:8px;border-bottom:1px solid var(--line-2)}
.drawer h3 button{margin-left:auto;background:var(--surface-2);border:none;color:var(--ink-2);
  cursor:pointer;font-size:17px;line-height:1;width:30px;height:30px;border-radius:9px}
.drawer h3 button:hover{background:var(--line-2)}
.drawer .form{padding:20px 22px;overflow:auto;flex:1}
.drawer label{display:block;margin-bottom:14px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.drawer label input,.drawer label select,.drawer label textarea{display:block;width:100%;
  margin-top:6px;font-size:13.5px;color:var(--ink);font-weight:400}
.drawer .foot{padding:16px 22px;border-top:1px solid var(--line-2);display:flex;gap:9px}
.backdrop{position:fixed;inset:0;background:rgba(20,23,43,.32);z-index:35;display:none;
  backdrop-filter:blur(2px)}
.backdrop.open{display:block}
.readonly{background:var(--surface-2);padding:14px;border-radius:var(--r-md);margin-bottom:18px;font-size:12.5px}

.muted{color:var(--ink-3)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3)}
.hide{display:none}

@media(max-width:900px){
  .shell{flex-direction:column;padding:10px;gap:10px}
  .rail{width:auto;flex:none;height:auto;position:static;flex-direction:row;overflow-x:auto;
    padding:10px;gap:2px}
  .brand{margin:0 8px 0 2px}
  .rail button{width:auto;padding:8px 12px;flex:0 0 auto}
  .gantt{grid-template-columns:140px 1fr}
  .topbar h1{font-size:18px}
  .hero .side{position:static;text-align:left;margin-top:14px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

<div class="shell">
  <aside class="rail" id="nav">
    <div class="brand">履</div>
    <button data-v="summary" title="總表" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg><span>總表</span></button>
    <button data-v="gantt" title="甘特圖"><svg viewBox="0 0 24 24"><path d="M4 6h9"/><path d="M7 12h11"/><path d="M4 18h7"/><circle cx="16" cy="6" r="1.6"/><circle cx="20" cy="12" r="1.6"/><circle cx="13" cy="18" r="1.6"/></svg><span>甘特圖</span></button>
    <button data-v="owner" title="業主交辦"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 10h16"/><path d="M9 14h6"/></svg><span>業主交辦</span></button>
    <button data-v="internal" title="內部交辦"><svg viewBox="0 0 24 24"><path d="M8 4h8v3H8z"/><path d="M6 5.5H5v15h14v-15h-1"/><path d="M9 12h6"/><path d="M9 16h4"/></svg><span>內部交辦</span></button>
    <button data-v="defect" title="缺失分析"><svg viewBox="0 0 24 24"><path d="M12 3.5 21 20H3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg><span>缺失分析</span></button>
    <button data-v="load" title="人員負荷"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M17 11.5a3 3 0 1 0-1.5-5.6"/><path d="M18 20c0-2.4-.9-4.2-2.4-5.3"/></svg><span>人員負荷</span></button>
    <button data-v="stats" title="統計"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/></svg><span>統計</span></button>
    <button data-v="import" title="匯入"><svg viewBox="0 0 24 24"><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/><path d="M4 15v4h16v-4"/></svg><span>匯入</span></button>
  </aside>

  <div class="stage">
    <div class="topbar">
      <div>
        <h1 id="greet">專案履約管理</h1>
        <div class="sub" id="greetSub">契約工項、交辦事項與缺失分析</div>
      </div>
      <div class="pill">
        <span class="num" id="todayLabel"></span>
        <span class="num" id="modeLabel"></span>
      </div>
    </div>
    <main id="main"><div class="empty">載入中…</div></main>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer">
  <h3><span id="drawerTitle">編輯</span><button id="drawerClose">×</button></h3>
  <div class="form" id="drawerForm"></div>
  <div class="foot">
    <button class="act" id="drawerSave">儲存</button>
    <button class="act ghost" id="drawerCancel">取消</button>
  </div>
</div>

<script>
/* ============================================================
   連線設定
   ------------------------------------------------------------
   這份檔案可以在兩種地方執行，程式會自動判斷：

   A) 放在 Apps Script 專案裡當 Index.html
      → 直接用 google.script.run，不需要下面的網址。

   B) 放在任何靜態主機（GitHub Pages、公司網站、本機開檔）
      → 用下面的 API_URL 連回 Apps Script 讀寫試算表。
         此時 Apps Script 的部署「存取權」必須設為「任何人」。
   ============================================================ */
var API_URL   = 'https://script.google.com/macros/s/AKfycby2cDiVqYnY5Suqv7IHsuSIiEEhk588AKTnBWh3pXPVrHhgiATp2eVCRJi1uoD3SrEe/exec';
var API_TOKEN = 'tcri-pm-2026';   // 必須與 Code.gs 的 API_TOKEN 相同

var DB = null, VIEW = 'summary', PROJ = '', EDIT = null;

/* ---------- 呼叫後端：自動選用 google.script.run 或 fetch ---------- */
var RPC_ARGS = {
  getDashboard: [],
  getTemplateHeaders: ['table'],
  updateRecord: ['table', 'row', 'patch'],
  addRecord: ['table', 'data'],
  importRows: ['table', 'rows']
};
var RPC_JSON = ['getDashboard', 'getTemplateHeaders'];   // 回傳字串，需再解析
var RPC_WRITE = ['updateRecord', 'addRecord', 'importRows'];

function inAppsScript(){
  return typeof google !== 'undefined' && google.script && google.script.run;
}

function rpc(name, params, ok, fail){
  params = params || {};
  fail = fail || function(e){ console.error(name, e); };

  if(inAppsScript()){
    var runner = google.script.run
      .withSuccessHandler(function(res){
        ok(RPC_JSON.indexOf(name) >= 0 ? JSON.parse(res) : res);
      })
      .withFailureHandler(fail);
    var args = (RPC_ARGS[name] || []).map(function(k){ return params[k]; });
    runner[name].apply(runner, args);
    return;
  }

  if(!API_URL || API_URL.indexOf('script.google.com') < 0){
    fail(new Error('尚未設定 API_URL。請把 Apps Script 的 /exec 網址填進檔案開頭的 API_URL。'));
    return;
  }

  var body = Object.assign({ api: name, token: API_TOKEN }, params);
  var req;
  if(RPC_WRITE.indexOf(name) >= 0){
    // 寫入用 POST；text/plain 可避開預檢請求（Apps Script 不處理 OPTIONS）
    req = fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    });
  } else {
    var qs = Object.keys(body).map(function(k){
      return encodeURIComponent(k) + '=' + encodeURIComponent(body[k]);
    }).join('&');
    req = fetch(API_URL + '?' + qs, { method: 'GET', redirect: 'follow' });
  }

  req.then(function(r){ return r.text(); })
     .then(function(txt){
       var res;
       try { res = JSON.parse(txt); }
       catch(e){
         throw new Error('後端回傳的不是 JSON。多半是部署存取權沒設成「任何人」，'
           + '導致收到 Google 登入頁。開頭內容：' + txt.slice(0, 120));
       }
       if(!res.ok) throw new Error(res.error || '後端回報失敗');
       ok(res.data);
     })
     .catch(function(e){
       if(String(e.message).indexOf('Failed to fetch') >= 0){
         fail(new Error('無法連線到 Apps Script。請確認：1) API_URL 正確且以 /exec 結尾；'
           + '2) 部署的「存取權」設為「任何人」；3) 已用「新版本」重新部署。'));
       } else fail(e);
     });
}

/* ---------- 工具 ---------- */
function roc(ymd){ if(!ymd) return '—';
  var p = ymd.split('-'); return (Number(p[0])-1911) + '.' + p[1] + '.' + p[2]; }
function d(ymd){ if(!ymd) return null; var p = ymd.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function days(a,b){ return Math.round((b-a)/86400000); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function lightDot(l){ return '<span class="dot '+l+'"></span>'; }
function pct(n){ return (Math.round(n*10)/10) + '%'; }
function rocWeek(ymd){
  var dt = d(ymd); if(!dt) return '';
  var t = new Date(dt.getTime()); t.setDate(t.getDate() + 4 - (t.getDay()||7));
  var y0 = new Date(t.getFullYear(),0,1);
  var wk = Math.ceil((((t-y0)/86400000)+1)/7);
  return (t.getFullYear()-1911) + '-W' + (wk<10?'0':'') + wk;
}
function progBar(planned, actual){
  return '<div style="min-width:110px;padding-top:2px">'+
         '<div class="prog"><span>'+pct(actual)+'</span>'+
         '<i style="width:'+Math.min(planned,100)+'%"></i>'+
         '<b style="width:'+Math.min(actual,100)+'%"></b></div></div>';
}

/* ---------- 載入 ---------- */
function fatal(title, lines){
  document.getElementById('main').innerHTML =
    '<div class="card"><h2>'+esc(title)+'</h2><div class="body">'+
    lines.map(function(l){return '<p>'+l+'</p>';}).join('')+'</div></div>';
}

function load(){
  // 靜態主機模式下，API_URL 沒設好就先講清楚
  if(!inAppsScript() && (!API_URL || API_URL.indexOf('script.google.com') < 0)){
    fatal('尚未設定連線網址', [
      '目前網址：<code>'+esc(location.href)+'</code>',
      '這份檔案不是在 Apps Script 裡執行，需要靠檔案開頭的 <code>API_URL</code> 連回試算表。',
      '請把 Apps Script 的部署網址（<code>https://script.google.com/macros/s/.../exec</code>）'+
      '填進檔案開頭的 API_URL，並確認 API_TOKEN 與 Code.gs 一致。'
    ]);
    return;
  }

  var done = false;
  var timer = setTimeout(function(){
    if(done) return;
    fatal('伺服器沒有回應（已等待 25 秒）', [
      '常見原因：',
      '1. 試算表分頁還沒建立 —— 回到試算表，選單「專案履約管理 → 初始化分頁」執行一次。'+
      '若選單沒出現，把試算表關掉重開。',
      '2. 授權尚未完成 —— 在 Apps Script 編輯器手動執行一次 <code>setupAllSheets</code>，完成授權流程後再回來。',
      '3. 資料量過大或分頁被改名 —— 分頁名稱必須與程式一致（01_專案主檔、02_契約工項…）。',
      '4. 若這頁是放在 GitHub Pages 或公司網站，請確認 Apps Script 部署的「存取權」設為「任何人」，'+
      '且改完程式後有用「新版本」重新部署。',
      '<button class="act" onclick="load()">重新載入</button>'
    ]);
  }, 25000);

  rpc('getDashboard', {}, function(data){
    done = true; clearTimeout(timer);
    DB = data;
    var h = new Date().getHours();
    var hi = h<6 ? '夜深了' : h<11 ? '早安' : h<13 ? '午安' : h<18 ? '下午好' : '晚安';
    document.getElementById('greet').textContent = hi + '，今天有 ' +
      DB.projects.filter(function(p){return p.status==='履約中';}).length + ' 案在履約';
    document.getElementById('greetSub').textContent = '契約工項、交辦事項與缺失分析';
    document.getElementById('todayLabel').textContent = roc(DB.today);
    document.getElementById('modeLabel').textContent =
      inAppsScript() ? '內嵌模式' : '連線模式';
    if(!PROJ && DB.projects.length) PROJ = DB.projects[0].code;
    render();
  }, function(e){
    done = true; clearTimeout(timer);
    var msg = (e && e.message) ? e.message : String(e);
    var hint = '';
    if(msg.indexOf('getSheetByName') >= 0 || msg.indexOf('null') >= 0){
      hint = '看起來是分頁不存在。請在試算表執行選單「專案履約管理 → 初始化分頁」。';
    } else if(msg.indexOf('HEADERS') >= 0 || msg.indexOf('SHEETS') >= 0){
      hint = '看起來是 Setup.gs 的內容沒有貼進專案。請確認左側有 Setup.gs 且內容完整。';
    } else if(msg.indexOf('permission') >= 0 || msg.indexOf('授權') >= 0){
      hint = '權限不足。請在 Apps Script 手動執行一次 setupAllSheets 完成授權。';
    }
    fatal('讀取資料失敗', [
      '<code>'+esc(msg)+'</code>',
      hint || '請確認試算表分頁已建立，且 Setup.gs 與 Code.gs 內容都已貼入專案。',
      '<button class="act" onclick="load()">重新載入</button>'
    ]);
  });
}

document.getElementById('nav').addEventListener('click', function(e){
  var b = e.target.closest('button[data-v]'); if(!b) return;
  VIEW = b.dataset.v;
  [].forEach.call(this.querySelectorAll('button'), function(x){
    x.setAttribute('aria-selected', x===b ? 'true':'false'); });
  render();
});

function render(){
  var m = document.getElementById('main');
  if(!DB){ m.innerHTML = '<div class="empty">載入中…</div>'; return; }
  if(!DB.projects.length && VIEW!=='import' && VIEW!=='defect'){
    m.innerHTML='<div class="card"><div class="body">尚未建立任何專案。請在試算表的「01_專案主檔」新增一列，或到「匯入」頁貼上資料。</div></div>';
    return;
  }
  ({summary:viewSummary, gantt:viewGantt, owner:viewOwner, internal:viewInternal,
    defect:viewDefect, load:viewLoad, stats:viewStats, import:viewImport})[VIEW](m);
}

function viewSummary(m){
  var rows = DB.projects.map(function(p){
    return '<tr data-proj="'+esc(p.code)+'">'+
      '<td>'+lightDot(p.light)+'<b>'+esc(p.code||'—')+'</b></td>'+
      '<td>'+esc(p.name)+'<div class="muted">'+esc(p.client||'')+'</div></td>'+
      '<td class="num">'+roc(p.finish)+'</td>'+
      '<td class="num r">'+(p.remain===''?'—':p.remain)+'</td>'+
      '<td>'+progBar(p.planned,p.actual)+'<div class="muted" style="font-size:11px;margin-top:4px">預計 '+pct(p.planned)+'</div></td>'+
      '<td class="num r" style="font-weight:700;color:'+(p.diff<0?'var(--red)':'var(--green)')+'">'+(p.diff>0?'+':'')+p.diff+'%</td>'+
      '<td class="num r">'+p.openOwner+'</td>'+
      '<td class="num r">'+(p.overdue?'<b style="color:var(--red)">'+p.overdue+'</b>':'0')+'</td>'+
      '<td class="num r">'+p.waiting+'</td>'+
      '<td class="num r">'+p.openInternal+'</td>'+
      '<td><span class="tag">'+esc(p.status||'')+'</span></td></tr>';
  }).join('');

  var totalOpen = DB.owner.concat(DB.internal).filter(openTask).length;
  var overdue = DB.projects.reduce(function(a,p){return a+p.overdue;},0);
  var active = DB.projects.filter(function(p){return p.status==='履約中';}).length;
  var avgActual = DB.projects.length ?
    Math.round(DB.projects.reduce(function(a,p){return a+p.actual;},0)/DB.projects.length*10)/10 : 0;

  var avgPlanned = DB.projects.length ?
    Math.round(DB.projects.reduce(function(a,p){return a+p.planned;},0)/DB.projects.length*10)/10 : 0;
  var gap = Math.round((avgActual-avgPlanned)*10)/10;
  var nearest = DB.projects.filter(function(p){return p.remain!=='' && p.remain>=0;})
    .sort(function(a,b){return a.remain-b.remain;})[0];

  m.innerHTML =
   '<div class="hero">'+
     '<div class="cap">全案加權實際進度</div>'+
     '<div class="big">'+pct(avgActual)+'</div>'+
     '<div class="meta">預計 '+pct(avgPlanned)+'　'+
       (gap<0 ? '落後 '+Math.abs(gap)+' 個百分點' : '超前 '+gap+' 個百分點')+'</div>'+
     '<div class="track"><i style="width:'+Math.min(avgActual,100)+'%"></i>'+
       '<u style="left:'+Math.min(avgPlanned,100)+'%"></u></div>'+
     (nearest ? '<div class="side"><b>'+nearest.remain+' 天</b><span>'+esc(nearest.code||nearest.name)+' 距契約完工</span></div>' : '')+
   '</div>'+
   '<div class="kpis">'+
     kpi('在履約案件', active, '共 '+DB.projects.length+' 案', 'folder', 'lilac') +
     kpi('未結案事項', totalOpen, '業主 '+DB.owner.filter(openTask).length+'　內部 '+DB.internal.filter(openTask).length, 'inbox', 'sky') +
     kpi('逾期事項', overdue, overdue? '需優先處理':'目前無逾期', 'alert', overdue? 'rose':'mint') +
     kpi('待業主回覆', DB.projects.reduce(function(a,p){return a+p.waiting;},0), '平均等待見統計頁', 'clock', 'peach') +
   '</div>'+
   '<div class="card"><h2>專案總表</h2><div class="scroll"><table>'+
   '<thead><tr><th>代號</th><th>專案／業主</th><th>契約完工日</th><th class="r">剩餘天</th>'+
   '<th>進度（實際／預計）</th><th class="r">差異</th><th class="r">業主未結</th>'+
   '<th class="r">逾期</th><th class="r">待回覆</th><th class="r">內部未結</th><th>狀態</th></tr></thead>'+
   '<tbody>'+rows+'</tbody></table></div>'+
   '<div class="legend"><span>燈號｜差異 &lt; −10% 或有逾期事項 → 紅；差異 −5%～−10% → 黃；其餘 → 綠</span></div></div>';

  [].forEach.call(m.querySelectorAll('tr[data-proj]'), function(tr){
    tr.onclick = function(){ PROJ = tr.dataset.proj; VIEW='gantt';
      [].forEach.call(document.querySelectorAll('#nav button'),function(x){
        x.setAttribute('aria-selected', x.dataset.v==='gantt'?'true':'false'); });
      render(); };
  });
}

function kpi(label,value,sub,icon,tint){
  return '<div class="kpi">'+
    (icon ? '<div class="ktile t-'+(tint||'lilac')+'"><svg viewBox="0 0 24 24">'+ICON[icon]+'</svg></div>' : '')+
    '<div class="kbody"><div class="label">'+label+'</div><div class="value">'+value+
    '</div><div class="sub">'+esc(sub)+'</div></div></div>';
}
function openTask(t){ return ['已完成','已結案','已取消'].indexOf(t.status)<0; }

/* ---------- 甘特圖 ---------- */
function viewGantt(m){
  var p = DB.projects.filter(function(x){return x.code===PROJ;})[0] || DB.projects[0];
  PROJ = p.code;
  var items = DB.workItems[p.code] || [];
  var dated = items.filter(function(i){return i.start && i.end;});

  var head = '<div class="card"><div class="body"><div class="toolbar">'+
    '<select id="projSel">'+DB.projects.map(function(x){
      return '<option value="'+esc(x.code)+'"'+(x.code===p.code?' selected':'')+'>'+esc(x.code)+'　'+esc(x.name)+'</option>';}).join('')+'</select>'+
    '<select id="zoom"><option value="3">縮放：季</option><option value="6" selected>縮放：月</option><option value="14">縮放：週</option></select>'+
    '<span class="muted num">履約起始 '+roc(p.start)+'　契約完工 '+roc(p.finish)+'　工期 '+p.duration+' '+esc(p.mode)+
    (p.extend? '（展延 '+p.extend+'）':'')+'　權重合計 '+p.weightSum+'%</span>'+
    '</div></div></div>';

  if(!dated.length){
    m.innerHTML = head + '<div class="card"><div class="empty">此專案尚無可排程的工項。請在「02_契約工項」填入工項編號與工期天數。</div></div>';
    bindProjSel(); return;
  }

  var min = dated.reduce(function(a,i){var s=d(i.start);return (!a||s<a)?s:a;},null);
  var max = dated.reduce(function(a,i){var e=d(i.end);return (!a||e>a)?e:a;},null);
  var fin = d(p.finish); if(fin && fin>max) max = fin;
  min = new Date(min.getFullYear(), min.getMonth(), 1);
  max = new Date(max.getFullYear(), max.getMonth()+1, 0);
  var span = days(min,max)+1;
  var dw = Number(localStorage_get('zoom') || 6);
  var width = span*dw;

  // 月刻度
  var axis = '', cur = new Date(min.getFullYear(), min.getMonth(), 1);
  while(cur <= max){
    var x = days(min,cur)*dw;
    axis += '<div class="m" style="left:'+x+'px">'+(cur.getFullYear()-1911)+'.'+
            ('0'+(cur.getMonth()+1)).slice(-2)+'</div>';
    cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  }
  var todayX = days(min, d(DB.today))*dw;

  // 交辦事項圖釘（掛在關聯工項那一列）
  var pins = {};
  DB.owner.filter(function(o){return o.project===p.code && o.link && openTask(o);}).forEach(function(o){
    (pins[o.link] = pins[o.link] || []).push(o);
  });

  var names = '', cells = '';
  items.forEach(function(i){
    var lvl = 'lvl'+Math.min(i.level||1,3);
    names += '<div class="grow '+lvl+'" title="'+esc(i.code+' '+i.name)+'">'+
             '<span class="num muted">'+esc(i.code)+'</span>　'+esc(i.name)+'</div>';
    var inner = '';
    if(i.start && i.end){
      var x = days(min,d(i.start))*dw;
      var w = Math.max((days(d(i.start),d(i.end))+1)*dw, 3);
      if(i.milestone){
        inner += '<div class="ms'+(i.pct>=100?' filled':'')+'" style="left:'+(x-5)+'px" title="里程碑 '+roc(i.end)+'"></div>';
      } else {
        inner += '<div class="bar-plan" style="left:'+x+'px;width:'+w+'px" title="預計 '+roc(i.start)+' – '+roc(i.end)+'"></div>';
        if(i.pct>0){
          var late = i.pct < i.plannedPct - 5;
          inner += '<div class="bar-act'+(late?' late':'')+'" style="left:'+x+'px;width:'+Math.max(w*i.pct/100,4)+'px" title="實際 '+i.pct+'%（預計 '+i.plannedPct+'%）"></div>';
        }
      }
    }
    (pins[i.code]||[]).forEach(function(o){
      if(!o.due) return;
      var px = days(min,d(o.due))*dw;
      inner += '<div class="pin'+(o.light==='red'?' red':'')+'" style="left:'+px+'px" title="'+esc(o.id+'　'+o.content)+'"></div>';
    });
    cells += '<div class="gcell '+lvl+'">'+inner+'</div>';
  });

  m.innerHTML = head +
    '<div class="card"><h2>履約甘特圖</h2>'+
    '<div class="gantt" style="--dw:'+dw+'px">'+
      '<div class="names"><div class="axis"></div>'+names+'</div>'+
      '<div class="chart"><div style="width:'+width+'px;position:relative">'+
        '<div class="axis">'+axis+'</div>'+
        '<div style="position:relative">'+cells+
          '<div class="today-line" style="left:'+todayX+'px"></div></div>'+
      '</div></div>'+
    '</div>'+
    '<div class="legend">'+
      '<span><i style="background:#D6CEFF"></i>預計工期</span>'+
      '<span><i style="background:var(--accent)"></i>實際完成</span>'+
      '<span><i style="background:var(--red)"></i>落後預計 5% 以上</span>'+
      '<span><i style="background:var(--amber);width:3px;height:13px;border-radius:2px;margin-right:7px"></i>未結交辦事項到期日</span>'+
      '<span>◇ 里程碑　┊ 今日</span>'+
    '</div></div>'+
    workItemTable(items);

  bindProjSel();
  document.getElementById('zoom').value = String(dw);
  document.getElementById('zoom').onchange = function(){ localStorage_set('zoom', this.value); render(); };
  [].forEach.call(m.querySelectorAll('tr[data-wrow]'), function(tr){
    tr.onclick = function(){ openWorkItem(Number(tr.dataset.wrow)); };
  });
}

function bindProjSel(){
  var s = document.getElementById('projSel');
  if(s) s.onchange = function(){ PROJ = this.value; render(); };
}

function workItemTable(items){
  var rows = items.map(function(i){
    var lag = i.parent ? '' : (i.pct - i.plannedPct);
    return '<tr data-wrow="'+i.row+'">'+
      '<td class="num">'+esc(i.code)+'</td>'+
      '<td style="padding-left:'+(8+(i.level-1)*14)+'px">'+(i.level===1?'<b>':'')+esc(i.name)+(i.level===1?'</b>':'')+
        (i.milestone?' <span class="tag">里程碑</span>':'')+'</td>'+
      '<td class="num r">'+(i.duration||'—')+'</td>'+
      '<td class="num">'+roc(i.start)+'</td>'+
      '<td class="num">'+roc(i.end)+'</td>'+
      '<td class="num r">'+(i.weight||'—')+'</td>'+
      '<td>'+esc(i.owner||'')+'</td>'+
      '<td class="num r">'+(i.parent?'—':i.plannedPct+'%')+'</td>'+
      '<td class="num r">'+(i.parent?'—':i.pct+'%')+'</td>'+
      '<td class="num r" style="font-weight:600;color:'+(lag<0?'var(--red)':'var(--green)')+'">'+(i.parent?'':(lag>0?'+':'')+lag+'%')+'</td>'+
      '<td>'+(i.status?'<span class="tag">'+esc(i.status)+'</span>':'<span class="muted">—</span>')+'</td></tr>';
  }).join('');
  return '<div class="card"><h2>契約工項</h2><div class="scroll"><table>'+
    '<thead><tr><th>工項</th><th>名稱</th><th class="r">工期</th><th>預計開始</th><th>預計完成</th>'+
    '<th class="r">權重</th><th>負責人</th><th class="r">預計%</th><th class="r">實際%</th>'+
    '<th class="r">差異</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="legend"><span>點任一列可更新實際起訖日與完成百分比</span></div></div>';
}

/* ---------- 交辦表 ---------- */
function taskFilterBar(showProject){
  return '<div class="toolbar">'+
    (showProject? '<select id="fProj"><option value="">全部專案</option>'+
      DB.projects.map(function(x){return '<option value="'+esc(x.code)+'">'+esc(x.code)+'</option>';}).join('')+
      '<option value="內部">內部</option></select>':'')+
    '<select id="fOwner"><option value="">全部承辦人</option>'+
      DB.people.map(function(x){return '<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>';}).join('')+'</select>'+
    '<select id="fStatus"><option value="open">僅未結案</option><option value="">全部狀態</option>'+
      ['未開始','進行中','待業主回覆','已完成','已結案'].map(function(s){
        return '<option value="'+s+'">'+s+'</option>';}).join('')+'</select>'+
    '<button class="act" id="btnAdd">新增事項</button></div>';
}
function applyFilter(list){
  var fp = document.getElementById('fProj'), fo = document.getElementById('fOwner'), fs = document.getElementById('fStatus');
  var vp = fp?fp.value:'', vo = fo?fo.value:'', vs = fs?fs.value:'open';
  return list.filter(function(t){
    if(vp && t.project!==vp) return false;
    if(vo && t.owner!==vo) return false;
    if(vs==='open') return openTask(t);
    if(vs) return t.status===vs;
    return true;
  });
}
function bindFilters(){
  ['fProj','fOwner','fStatus'].forEach(function(id){
    var el = document.getElementById(id); if(el) el.onchange = redrawTaskBody;
  });
}

function viewOwner(m){
  m.innerHTML = '<div class="card"><div class="body">'+taskFilterBar(true)+'</div></div>'+
    '<div class="card"><h2>業主交辦事項</h2><div class="scroll" id="taskWrap"></div>'+
    '<div class="legend"><span>灰＝待業主回覆（不計我方逾期）　黃＝7 日內到期或逾兩週未更新　紅＝已逾期</span></div></div>';
  bindFilters();
  document.getElementById('btnAdd').onclick = function(){ openNew('owner'); };
  redrawTaskBody();
}
function viewInternal(m){
  m.innerHTML = '<div class="card"><div class="body">'+taskFilterBar(true)+'</div></div>'+
    '<div class="card"><h2>內部作業交辦</h2><div class="scroll" id="taskWrap"></div></div>';
  bindFilters();
  document.getElementById('btnAdd').onclick = function(){ openNew('internal'); };
  redrawTaskBody();

/* ---------- 缺失分析 ---------- */
var DEF_DIM = 'minor';   // 統計維度
var DEF_FILTER = {proj:'', stage:'', trade:'', sev:'', open:'all'};

function defList(){
  return (DB.defects||[]).filter(function(x){
    if(DEF_FILTER.proj && x.project!==DEF_FILTER.proj) return false;
    if(DEF_FILTER.stage && x.stage!==DEF_FILTER.stage) return false;
    if(DEF_FILTER.trade && x.trade!==DEF_FILTER.trade) return false;
    if(DEF_FILTER.sev && x.severity!==DEF_FILTER.sev) return false;
    if(DEF_FILTER.open==='open' && !x.open) return false;
    if(DEF_FILTER.open==='closed' && x.open) return false;
    return true;
  });
}
function uniq(list, key){
  var seen = {}, out = [];
  list.forEach(function(x){ var v=x[key]; if(v && !seen[v]){seen[v]=1;out.push(v);} });
  return out.sort();
}
function tally(list, key){
  var m = {};
  list.forEach(function(x){ var v = x[key] || '（未分類）'; m[v] = (m[v]||0)+1; });
  return Object.keys(m).map(function(k){return {k:k, n:m[k]};})
    .sort(function(a,b){return b.n-a.n;});
}

function selFilter(id, allLabel, options, cur){

    options.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
}
function bindDefFilter(id, key){
  var el = document.getElementById(id); if(!el) return;
  el.onchange = function(){ DEF_FILTER[key] = this.value; render(); };
}

function paretoTable(list, dim){
  var data = tally(list, dim);
  if(!data.length) return '<div class="empty">沒有符合條件的缺失。</div>';
  var total = data.reduce(function(a,b){return a+b.n;},0);
  var max = data[0].n, cum = 0;
  var rows = data.map(function(d, i){
    cum += d.n;
    var cp = Math.round(cum/total*1000)/10;
    var hot = cp <= 80.5 ? ' hot' : '';
    return '<tr><td class="num muted" style="width:26px">'+(i+1)+'</td>'+
      '<td style="width:200px">'+esc(d.k)+'</td>'+
      '<td class="bar-cell"><div class="bar"><i class="'+hot.trim()+'" style="width:'+(d.n/max*100)+'%"></i></div></td>'+
      '<td class="num r" style="width:50px">'+d.n+'</td>'+
      '<td class="num r" style="width:60px">'+Math.round(d.n/total*1000)/10+'%</td>'+
      '<td class="cum r" style="width:70px">累計 '+cp+'%</td></tr>';
  }).join('');
  var c=0, k=0;
  for(var i=0;i<data.length;i++){ c+=data[i].n; k++; if(c/total>=0.8) break; }
  return '<table class="pareto"><tbody>'+rows+'</tbody></table>'+
    '<div class="legend"><span>深色為累計 80% 以內的關鍵少數——'+
    '前 '+k+' 類即佔全部缺失的 '+Math.round(c/total*1000)/10+'%，改善資源應集中於此。</span></div>';
}

function crossTable(list){
  var minors = tally(list,'minor').slice(0,12).map(function(d){return d.k;});
  var trades = uniq(list,'trade');
  if(!minors.length || !trades.length) return '<div class="empty">資料不足。</div>';
  var grid = {};
  list.forEach(function(x){
    var mi = x.minor||'（未分類）', tr = x.trade||'（未填）';
    grid[mi+'|'+tr] = (grid[mi+'|'+tr]||0)+1;
  });
  var maxv = 1;
  minors.forEach(function(mi){ trades.forEach(function(tr){ maxv = Math.max(maxv, grid[mi+'|'+tr]||0); }); });
  var head = '<tr><th>中類 ＼ 專業</th>'+trades.map(function(t){return '<th class="r">'+esc(t)+'</th>';}).join('')+'<th class="r">小計</th></tr>';
  var rows = minors.map(function(mi){
    var sum = 0;
    var tds = trades.map(function(tr){
      var v = grid[mi+'|'+tr]||0; sum += v;
      if(!v) return '<td class="c"></td>';
      var a = 0.16 + 0.74*v/maxv;
      return '<td class="c"><span class="hcell" style="background:rgba(91,61,245,'+a.toFixed(2)+');'+
        (a>0.5?'color:#fff':'color:var(--accent)')+'">'+v+'</span></td>';
    }).join('');
    return '<tr><td>'+esc(mi)+'</td>'+tds+'<td class="c"><b>'+sum+'</b></td></tr>';
  }).join('');
  return '<table class="heat"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table>';
}

function repeatTable(list){
  var m = {};
  list.forEach(function(x){
    var key = (x.project||'—')+'|'+(x.detail||x.minor||'（未分類）');
    if(!m[key]) m[key] = {project:x.project, detail:x.detail||x.minor, n:0, open:0, zones:{}};
    m[key].n++;
    if(x.open) m[key].open++;
    if(x.zone) m[key].zones[x.zone] = 1;
  });
  var rows = Object.keys(m).map(function(k){return m[k];})
    .filter(function(r){return r.n>=2;})
    .sort(function(a,b){return b.n-a.n;}).slice(0,15);
  if(!rows.length) return '<div class="empty">目前沒有重複發生 2 次以上的缺失細項。</div>';
  return '<table><thead><tr><th>專案</th><th>缺失細項</th><th class="r">次數</th>'+
    '<th class="r">未結</th><th>發生區域</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr><td class="num">'+esc(r.project)+'</td><td>'+esc(r.detail)+'</td>'+
        '<td class="num r"><b>'+r.n+'</b></td><td class="num r">'+r.open+'</td>'+
        '<td class="muted">'+esc(Object.keys(r.zones).join('、'))+'</td></tr>';
    }).join('')+'</tbody></table>'+
    '<div class="legend"><span>重複 3 次以上通常不是個案，應回頭檢討工序、教育訓練或圖說。</span></div>';
}

function defectTable(list){

      '<td>'+esc(x.result||'')+'</td>'+

  }).join('');
  return '<table><thead><tr><th>編號</th><th>專案</th><th>開立日</th><th>區域／專業</th>'+
    '<th>分類</th><th>缺失描述</th><th>嚴重度</th><th>根本原因</th><th>要求改善</th>'+
    '<th class="r">改善天</th><th>複驗</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table>';

function viewLoad(m){

  }).join('');

  m.innerHTML = '<div class="card"><h2>人員負荷（未結案事項，依排定週次）</h2><div class="scroll"><table>'+
    '<thead><tr><th>承辦人</th><th class="r">未結</th><th class="r">逾期</th><th class="r">待回覆</th>'+
    weeks.map(function(w){return '<th class="r num">'+w+'</th>';}).join('')+
    '<th class="r">週可用</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="legend"><span>單週人天超過可用量亮黃、超過 1 天以上亮紅。點承辦人可看個人週報。</span></div></div>'+
    '<div id="weekly"></div>';

  [].forEach.call(m.querySelectorAll('tr[data-person]'), function(tr){
    tr.onclick = function(){ renderWeekly(tr.dataset.person, weeks[0], weeks[1]); };
  });
}

function renderWeekly(name, thisWeek, nextWeek){
  var all = DB.owner.concat(DB.internal).filter(function(t){return t.owner===name;});
  function li(list, fmt){ return list.length
    ? '<ul style="margin:6px 0 0;padding-left:20px">'+list.map(fmt).join('')+'</ul>'
    : '<div class="muted" style="margin-top:6px">無</div>'; }
  var doneThis = all.filter(function(t){return !openTask(t) && t.done && rocWeek(t.done)===thisWeek;});
  var doing = all.filter(function(t){return t.status==='進行中';});
  var blocked = all.filter(function(t){return openTask(t) && t.blocker;});
  var next = all.filter(function(t){return openTask(t) && t.week===nextWeek;});
  var waiting = all.filter(function(t){return t.status==='待業主回覆';});

  document.getElementById('weekly').innerHTML =
    '<div class="card"><h2>'+esc(name)+'　'+thisWeek+' 工作週報</h2><div class="body">'+
    '<b>本週完成</b>'+ li(doneThis, function(t){return '<li>'+esc(t.id)+'　'+esc(t.content)+'</li>';}) +
    '<b style="display:block;margin-top:12px">本週進行中</b>'+ li(doing, function(t){
        return '<li>'+esc(t.id)+'　'+esc(t.content)+(t.note?'<div class="muted">'+esc(t.note)+'</div>':'')+'</li>';}) +
    '<b style="display:block;margin-top:12px">卡點與需協助</b>'+ li(blocked, function(t){
        return '<li>'+esc(t.id)+'　'+esc(t.blocker)+'</li>';}) +
    '<b style="display:block;margin-top:12px">下週預計（'+nextWeek+'）</b>'+ li(next, function(t){
        return '<li>'+esc(t.id)+'　'+esc(t.content)+'（'+(t.effort||0)+' 人天）</li>';}) +
    '<b style="display:block;margin-top:12px">待他人回覆</b>'+ li(waiting, function(t){
        var w = t.updated ? days(d(t.updated), d(DB.today)) : '—';
        return '<li>'+esc(t.id)+'　'+esc(t.content)+'（已等 '+w+' 日）</li>';}) +
    '<div style="margin-top:14px"><button class="act ghost" onclick="copyWeekly()">複製週報文字</button></div>'+
    '</div></div>';
  document.getElementById('weekly').scrollIntoView({behavior:'smooth'});
}
function copyWeekly(){
  var t = document.getElementById('weekly').innerText;
  navigator.clipboard.writeText(t).then(function(){ alert('週報已複製，可直接貼到郵件或會議紀錄。'); });
}

/* ---------- 統計 ---------- */
function viewStats(m){
  var all = DB.owner.concat(DB.internal);
  var open = all.filter(openTask);
  var waits = DB.owner.filter(function(t){return t.status==='待業主回覆' && t.updated;})
    .map(function(t){ return days(d(t.updated), d(DB.today)); });
  var avgWait = waits.length ? Math.round(waits.reduce(function(a,b){return a+b;},0)/waits.length) : 0;
  var d30 = new Date(d(DB.today).getTime()); d30.setDate(d30.getDate()-30);
  var added = all.filter(function(t){ return t.raised && d(t.raised) >= d30; }).length;
  var closed = all.filter(function(t){ return t.done && d(t.done) >= d30; }).length;
  var change = DB.owner.filter(function(t){return t.changeOrder==='是';});
  var affect = DB.owner.filter(function(t){return t.affectSchedule==='是';});

  var bySource = {};
  DB.owner.forEach(function(t){ bySource[t.source] = (bySource[t.source]||0)+1; });
  var byType = {};
  DB.internal.forEach(function(t){ byType[t.type] = (byType[t.type]||0)+1; });

  function barList(obj){
    var max = Math.max.apply(null, Object.keys(obj).map(function(k){return obj[k];}).concat([1]));
    return Object.keys(obj).map(function(k){
      return '<tr><td>'+esc(k)+'</td><td style="width:60%"><div style="height:9px;border-radius:99px;'+
        'background:var(--accent);width:'+(obj[k]/max*100)+'%"></div></td>'+
        '<td class="num r">'+obj[k]+'</td></tr>';
    }).join('') || '<tr><td colspan="3" class="muted">無資料</td></tr>';
  }

  m.innerHTML =
    '<div class="kpis">'+
      kpi('未結事項', open.length, '近 30 日新增 '+added+'、結案 '+closed, 'inbox', 'lilac') +
      kpi('待業主回覆', DB.owner.filter(function(t){return t.status==='待業主回覆';}).length, '平均已等 '+avgWait+' 日', 'clock', 'sky') +
      kpi('涉及契約變更', change.length, '需併入變更程序', 'swap', 'peach') +
      kpi('可能影響工期', affect.length, '展延主張之依據', 'alert', affect.length? 'rose':'mint') +
    '</div>'+
    '<div class="card"><h2>業主交辦來源分布</h2><div class="body"><table>'+barList(bySource)+'</table></div></div>'+
    '<div class="card"><h2>內部交辦類別分布</h2><div class="body"><table>'+barList(byType)+'</table></div></div>'+
    '<div class="card"><h2>各案進度差異</h2><div class="scroll"><table>'+
      '<thead><tr><th>專案</th><th>預計</th><th>實際</th><th class="r">差異</th><th>權重合計</th></tr></thead><tbody>'+
      DB.projects.map(function(p){
        return '<tr><td>'+lightDot(p.light)+esc(p.name)+'</td><td class="num">'+pct(p.planned)+
          '</td><td class="num">'+pct(p.actual)+'</td><td class="num r" style="color:'+
          (p.diff<0?'var(--red)':'var(--green)')+'">'+(p.diff>0?'+':'')+p.diff+'%</td>'+
          '<td class="num">'+p.weightSum+'%'+(Math.abs(p.weightSum-100)>0.5?' <span style="color:var(--amber)">（未達 100）</span>':'')+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
}

/* ---------- 匯入 ---------- */
var TABLE_LABEL = {project:'01_專案主檔', workitem:'02_契約工項', owner:'03_業主交辦',
  internal:'04_內部交辦', defect:'07_缺失紀錄', defectcat:'08_缺失類別'};
function viewImport(m){
  m.innerHTML = '<div class="card"><h2>批次匯入</h2><div class="body">'+
    '<div class="toolbar">'+
      '<select id="impTable">'+Object.keys(TABLE_LABEL).map(function(k){
        return '<option value="'+k+'">'+TABLE_LABEL[k]+'</option>';}).join('')+'</select>'+
      '<button class="act ghost" id="btnHeaders">取得欄位標題</button>'+
      '<button class="act" id="btnImport">匯入</button>'+
    '</div>'+
    '<p class="muted">從 Excel 直接複製整塊資料（含標題列）貼到下方，欄位順序不限，系統依標題比對。日期可用 2026-08-06 或 115.08.06。</p>'+
    '<textarea id="impText" rows="12" style="width:100%" placeholder="貼上資料…"></textarea>'+
    '<div id="impMsg" style="margin-top:10px"></div>'+
    '</div></div>';

  document.getElementById('btnHeaders').onclick = function(){
    var t = document.getElementById('impTable').value;
    rpc('getTemplateHeaders', {table: t}, function(headers){
      document.getElementById('impText').value = headers.join('\t') + '\n';
    });
  };
  document.getElementById('btnImport').onclick = doImport;
}
function doImport(){
  var t = document.getElementById('impTable').value;
  var text = document.getElementById('impText').value.trim();
  var msg = document.getElementById('impMsg');
  if(!text){ msg.innerHTML = '<span style="color:var(--red)">請先貼上資料。</span>'; return; }
  var lines = text.split(/\r?\n/).filter(function(l){return l.trim();});
  var sep = lines[0].indexOf('\t')>=0 ? '\t' : ',';
  var head = lines[0].split(sep).map(function(s){return s.trim().replace(/^"|"$/g,'');});
  var rows = lines.slice(1).map(function(l){
    var cells = l.split(sep), o = {};
    head.forEach(function(h,i){ o[h] = (cells[i]||'').trim().replace(/^"|"$/g,''); });
    return o;
  });
  if(!rows.length){ msg.innerHTML = '<span style="color:var(--red)">只有標題列，沒有資料。</span>'; return; }
  msg.textContent = '匯入中…';
  rpc('importRows', {table: t, rows: rows}, function(r){
    msg.innerHTML = '<span style="color:var(--green)">'+esc(r)+'</span>';
    document.getElementById('impText').value = '';
    load();
  }, function(e){
    msg.innerHTML = '<span style="color:var(--red)">匯入失敗：'+esc(e.message)+'</span>';
  });
}

/* ---------- 編輯抽屜 ---------- */
function field(label, name, value, type, options){
  var input;
  if(type==='select'){
    input = '<select name="'+name+'">'+options.map(function(o){
      return '<option'+(o===value?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
  } else if(type==='textarea'){
    input = '<textarea name="'+name+'" rows="3">'+esc(value||'')+'</textarea>';
  } else {
    input = '<input type="'+(type||'text')+'" name="'+name+'" value="'+esc(value||'')+'">';
  }
  return '<label>'+label+input+'</label>';
}
function openDrawer(title, html, onSave){
  document.getElementById('drawerTitle').textContent = title;
  document.getElementById('drawerForm').innerHTML = html;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
  EDIT = onSave;
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
  EDIT = null;
}
document.getElementById('drawerClose').onclick = closeDrawer;
document.getElementById('drawerCancel').onclick = closeDrawer;
document.getElementById('backdrop').onclick = closeDrawer;
document.getElementById('drawerSave').onclick = function(){
  if(!EDIT) return;
  var data = {};
  [].forEach.call(document.querySelectorAll('#drawerForm [name]'), function(el){
    data[el.name] = el.value;
  });
  this.disabled = true; this.textContent = '儲存中…';
  var btn = this;
  EDIT(data, function(){
    btn.disabled = false; btn.textContent = '儲存';
    closeDrawer(); load();
  }, function(e){
    btn.disabled = false; btn.textContent = '儲存';
    alert('儲存失敗：'+e.message);
  });
};
